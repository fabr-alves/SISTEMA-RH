        // --- COMPONENTES DE ÍCONES (COM PROTEÇÃO CONTRA ERROS) ---
        const Icon = ({ name, className }) => {
            const svgRef = React.useRef(null);
            useEffect(() => {
                if (svgRef.current && window.lucide) {
                    svgRef.current.innerHTML = '';
                    const iconDef = window.lucide.icons[name];
                    if(iconDef) {
                        const iconElement = window.lucide.createElement(iconDef);
                        if(iconElement) {
                            iconElement.setAttribute('class', className || '');
                            svgRef.current.appendChild(iconElement);
                        }
                    } else {
                        console.warn(`Ícone não encontrado: ${name}`);
                    }
                }
            }, [name, className]);
            return <span ref={svgRef} className={`inline-flex items-center justify-center ${className || ''}`}></span>;
        };

        // --- DADOS E DICIONÁRIOS ---

          'FG': { label: 'Folga', color: 'bg-gray-100 text-gray-600 border-gray-200 hover:bg-gray-200' },

          'LM': { label: 'Lic. Maternidade', color: 'bg-pink-100 text-pink-800 border-pink-200 hover:bg-pink-200' },
          'OB': { label: 'Óbito (Nojo)', color: 'bg-slate-200 text-slate-800 border-slate-300 hover:bg-slate-300' },
          'GT': { label: 'Gestante', color: 'bg-fuchsia-100 text-fuchsia-800 border-fuchsia-200 hover:bg-fuchsia-200' },
          'AD': { label: 'Admitido', color: 'bg-emerald-100 text-emerald-800 border-emerald-200 hover:bg-emerald-200' },
          'DE': { label: 'Demitido', color: 'bg-red-900 text-white border-red-900 hover:bg-red-800' },
          'TR': { label: 'Transferido', color: 'bg-gray-300 text-gray-800 border-gray-400 hover:bg-gray-400' },
          'TH': { label: 'Troca de Horário', color: 'bg-lime-100 text-lime-800 border-lime-300 hover:bg-lime-200' },
          'AJ': { label: 'Aguard. Jurídico', color: 'bg-amber-100 text-amber-800 border-amber-200 hover:bg-amber-200' },
          'MF': { label: 'Mudança Função', color: 'bg-cyan-100 text-cyan-800 border-cyan-200 hover:bg-cyan-200' }

        const PUNISHMENT_STEPS = [
          { id: 0, label: 'Sem Punição', color: 'bg-green-50 text-green-700 border-green-200', dot: 'bg-green-400' },
          { id: 1, label: '1ª Advertência', color: 'bg-gray-100 text-gray-700 border-gray-300', dot: 'bg-gray-400' },
          { id: 2, label: '2ª Advertência', color: 'bg-gray-200 text-gray-800 border-gray-400', dot: 'bg-gray-500' },
          { id: 3, label: '3ª Advertência', color: 'bg-gray-300 text-gray-900 border-gray-500', dot: 'bg-gray-600' },
          { id: 4, label: 'Susp. 1 Dia', color: 'bg-yellow-100 text-yellow-800 border-yellow-300', dot: 'bg-yellow-400' },
          { id: 5, label: 'Susp. 3 Dias', color: 'bg-orange-100 text-orange-800 border-orange-400', dot: 'bg-orange-500' },
          { id: 6, label: 'Susp. 5 Dias', color: 'bg-red-500 text-white font-bold border-red-700 shadow-md animate-pulse', dot: 'bg-red-600' },
          { id: 7, label: 'Susp. 7 Dias', color: 'bg-red-900 text-white font-bold border-red-950 shadow-lg', dot: 'bg-red-900' },
          { id: 8, label: 'Jurídico', color: 'bg-slate-900 text-white font-bold border-slate-950 shadow-xl', dot: 'bg-slate-900' }
        ];

        const INITIAL_EMPLOYEES = [];

        // --- FUNÇÕES DE DATA E UTILITÁRIOS ---
        const createLocalDate = (dateStr) => {
          if (!dateStr) return new Date();
          const [y, m, d] = dateStr.split('-');
          return new Date(y, m - 1, d, 12, 0, 0); 
        };

        const toLocalISODate = (date) => {
          const y = date.getFullYear();
          const m = String(date.getMonth() + 1).padStart(2, '0');
          const d = String(date.getDate()).padStart(2, '0');
          return `${y}-${m}-${d}`;
        };

        const getCycleDates = (year, month) => {
          const prevMonth = month === 1 ? 12 : month - 1;
          const prevYear = month === 1 ? year - 1 : year;
          const startDate = new Date(prevYear, prevMonth - 1, 19, 12, 0, 0);
          const endDate = new Date(year, month - 1, 18, 12, 0, 0);
          const dates = [];
          let currentDate = new Date(startDate);
          while (currentDate <= endDate) {
            dates.push(toLocalISODate(currentDate));
            currentDate.setDate(currentDate.getDate() + 1);
          }
          return dates;
        };

        const formatDateBR = (dateStr) => {
          if (!dateStr) return '';
          const parts = dateStr.split('-');
          if (parts.length === 3) return `${parts[2]}/${parts[1]}/${parts[0]}`;
          return dateStr;
        };

        const normalizeStatuses = (data) => {
          if (!data || data === '0') return [];
          if (Array.isArray(data)) return data;
          return [data];
        };

        const extractDateFromText = (text) => {
          const match = text.match(/(\d{2})\/(\d{2})\/(\d{4})/);
          if (match) return `${match[3]}-${match[2]}-${match[1]}`;
          return null;
        };

        let accessRequestApp = null;

        const getAccessRequestServices = () => {
          if (!accessRequestApp) {
            accessRequestApp = firebase.apps.find(app => app.name === 'csvaAccessRequest')
              || firebase.initializeApp(firebaseConfig, 'csvaAccessRequest');
          }
          return {
            requestAuth: accessRequestApp.auth(),
            requestDb: accessRequestApp.firestore()
          };
        };

        const submitAccessRequest = async (email, password) => {
          const { requestAuth, requestDb } = getAccessRequestServices();
          let credential = null;
          let createdNewAccount = false;

          try {
            try {
              credential = await requestAuth.createUserWithEmailAndPassword(email, password);
              createdNewAccount = true;
            } catch (createError) {
              if (createError.code !== 'auth/email-already-in-use') throw createError;
              credential = await requestAuth.signInWithEmailAndPassword(email, password);
            }

            await requestDb.collection(ACCESS_REQUESTS_COLLECTION).doc(credential.user.uid).set({
              uid: credential.user.uid,
              email,
              status: 'pending',
              requestedAt: firebase.firestore.FieldValue.serverTimestamp(),
              requestedAtIso: new Date().toISOString()
            });
          } catch (error) {
            if (createdNewAccount && credential?.user) {
              try { await credential.user.delete(); } catch (cleanupError) { console.error('Erro ao desfazer cadastro incompleto:', cleanupError); }
            }
            throw error;
          } finally {
            try { await requestAuth.signOut(); } catch (signOutError) { console.error('Erro ao encerrar solicitação:', signOutError); }
          }
        };

        // ==========================================
        // TELA DE LOGIN
        // ==========================================
        function LoginScreen({ systemNotice = '' }) {
            const [mode, setMode] = useState('login');
            const [email, setEmail] = useState('');
            const [password, setPassword] = useState('');
            const [username, setUsername] = useState('');
            const [requestPassword, setRequestPassword] = useState('');
            const [confirmPassword, setConfirmPassword] = useState('');
            const [error, setError] = useState('');
            const [success, setSuccess] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (e) => {
                e.preventDefault();
                setLoading(true);
                setError('');
                try {
                    await auth.signInWithEmailAndPassword(email, password);
                } catch (err) {
                    console.error(err);
                    setError('E-mail ou senha incorretos. Verifique suas credenciais.');
                } finally {
                    setLoading(false);
                }
            };

            const handleRequestAccess = async (e) => {
                e.preventDefault();
                setError('');
                setSuccess('');

                const cleanUsername = username.trim().toLowerCase();
                if (!/^[a-z0-9._-]+$/.test(cleanUsername)) {
                    setError('Digite apenas a parte do e-mail antes de @csva.com.br.');
                    return;
                }
                if (requestPassword.length < 6) {
                    setError('A senha precisa ter pelo menos 6 caracteres.');
                    return;
                }
                if (requestPassword !== confirmPassword) {
                    setError('As senhas digitadas não são iguais.');
                    return;
                }

                setLoading(true);
                try {
                    await submitAccessRequest(`${cleanUsername}${COMPANY_EMAIL_DOMAIN}`, requestPassword);
                    setSuccess('Solicitação enviada! Aguarde a aprovação do administrador antes de entrar.');
                    setUsername('');
                    setRequestPassword('');
                    setConfirmPassword('');
                } catch (err) {
                    console.error(err);
                    if (err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential') {
                        setError('Este e-mail já possui cadastro. Digite a senha correta para renovar a solicitação.');
                    } else if (err.code === 'auth/weak-password') {
                        setError('A senha precisa ter pelo menos 6 caracteres.');
                    } else if (err.code === 'auth/network-request-failed') {
                        setError('Não foi possível conectar. Verifique sua internet e tente novamente.');
                    } else if (err.code === 'permission-denied') {
                        setError('A solicitação não pôde ser registrada. Peça ao administrador para verificar as permissões do sistema.');
                    } else {
                        setError('Não foi possível enviar a solicitação. Tente novamente ou procure o administrador.');
                    }
                } finally {
                    setLoading(false);
                }
            };

            const changeMode = (newMode) => {
                setMode(newMode);
                setError('');
                setSuccess('');
            };

            return (
                <div className="flex min-h-screen w-full items-center justify-center py-6 bg-slate-900 bg-[url('https://www.transparenttextures.com/patterns/cubes.png')]">
                    <div className="bg-white p-10 rounded-2xl shadow-2xl w-full max-w-md animate-fade-in border border-slate-200">
                        <div className="flex flex-col items-center mb-8">
                            <div className="w-16 h-16 bg-blue-600 rounded-xl flex items-center justify-center shadow-lg mb-4">
                                <Activity className="w-10 h-10 text-white" />
                            </div>
                            <h1 className="text-3xl font-extrabold text-slate-800">CSVA RH</h1>
                            <p className="text-slate-500 text-sm font-medium mt-1">{mode === 'login' ? 'Acesso Restrito ao Sistema' : 'Solicitação de Acesso'}</p>
                        </div>

                        {mode === 'login' ? (
                            <form onSubmit={handleLogin} className="space-y-5">
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5 flex items-center gap-1"><Mail className="w-3.5 h-3.5"/> E-mail</label>
                                    <input 
                                        type="email" 
                                        required 
                                        className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-blue-50/30 transition-all font-medium text-slate-800"
                                        placeholder="usuario@csva.com.br"
                                        value={email}
                                        onChange={(e) => setEmail(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5 flex items-center gap-1"><Lock className="w-3.5 h-3.5"/> Senha</label>
                                    <input 
                                        type="password" 
                                        required 
                                        className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-blue-50/30 transition-all font-medium text-slate-800"
                                        placeholder="••••••••"
                                        value={password}
                                        onChange={(e) => setPassword(e.target.value)}
                                    />
                                </div>

                                {(error || systemNotice) && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold border border-red-200 flex items-center gap-2">
                                        <AlertTriangle className="w-5 h-5 shrink-0" /> {error || systemNotice}
                                    </div>
                                )}

                                <button 
                                    type="submit" 
                                    disabled={loading}
                                    className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-70 text-white font-bold py-3.5 rounded-xl shadow-md transition-all hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 mt-4"
                                >
                                    {loading ? <Activity className="w-5 h-5 animate-spin" /> : <React.Fragment><CheckCircle2 className="w-5 h-5"/> Entrar no Painel</React.Fragment>}
                                </button>
                            </form>
                        ) : (
                            <form onSubmit={handleRequestAccess} className="space-y-5">

                                        <input
                                            type="text"

                                            autoComplete="username"
                                            className="min-w-0 flex-1 px-4 py-3 outline-none bg-transparent font-medium text-slate-800"
                                            placeholder="nome.sobrenome"
                                            value={username}
                                            onChange={(e) => setUsername(e.target.value.toLowerCase().replace(/\s/g, '').replace(/@csva\.com\.br$/i, '').split('@')[0])}
                                        />
                                        <span className="flex items-center px-3 bg-slate-100 border-l border-slate-200 text-sm font-bold text-slate-600 whitespace-nowrap">@csva.com.br</span>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5 flex items-center gap-1"><Lock className="w-3.5 h-3.5"/> Criar senha</label>
                                    <input
                                        type="password"
                                        required
                                        minLength="6"
                                        autoComplete="new-password"
                                        className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-blue-50/30 transition-all font-medium text-slate-800"
                                        placeholder="Mínimo de 6 caracteres"
                                        value={requestPassword}
                                        onChange={(e) => setRequestPassword(e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-600 uppercase tracking-wide mb-1.5 flex items-center gap-1"><KeyRound className="w-3.5 h-3.5"/> Confirmar senha</label>
                                    <input
                                        type="password"
                                        required
                                        minLength="6"
                                        autoComplete="new-password"
                                        className="w-full border-2 border-slate-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-blue-50/30 transition-all font-medium text-slate-800"

                                        value={confirmPassword}
                                        onChange={(e) => setConfirmPassword(e.target.value)}
                                    />
                                </div>

                                {error && (
                                    <div className="bg-red-50 text-red-600 p-3 rounded-lg text-sm font-bold border border-red-200 flex items-center gap-2">

                                    </div>
                                )}
                                {success && (

                                    </div>
                                )}

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-70 text-white font-bold py-3.5 rounded-xl shadow-md transition-all hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2 mt-4"

                                    {loading ? <Activity className="w-5 h-5 animate-spin" /> : <React.Fragment><UserPlus className="w-5 h-5"/> Enviar Solicitação</React.Fragment>}
                                </button>

                        )}

                        <div className="mt-8 pt-6 border-t border-slate-100 text-center">
                            {mode === 'login' ? (
                                <React.Fragment>
                                    <p className="text-xs text-slate-400 font-medium mb-3">Área de Gestão Operacional.<br/>Ainda não possui credenciais?</p>

                                    <p className="text-xs text-slate-400 font-medium mb-3">Sua solicitação ficará aguardando a análise do administrador.</p>

                                </React.Fragment>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        // --- COMPONENTE PRINCIPAL ---
        function App() {
          const [user, setUser] = useState(null);
          const [isAuthChecking, setIsAuthChecking] = useState(true);
          const [accessNotice, setAccessNotice] = useState('');

          const [activeTab, setActiveTab] = useState('dashboard');
          
          const [employees, setEmployees] = useState(() => {
            const saved = localStorage.getItem('csva_employees_v5');
            return saved ? JSON.parse(saved) : INITIAL_EMPLOYEES;
          });
          const [records, setRecords] = useState(() => {
            const saved = localStorage.getItem('csva_records_v5');
            return saved ? JSON.parse(saved) : {};
          });
          const [punishments, setPunishments] = useState(() => {
            const saved = localStorage.getItem('csva_punishments_v5');
            return saved ? JSON.parse(saved) : {};
          });
          const [reminders, setReminders] = useState(() => {
            const saved = localStorage.getItem('csva_reminders_v1');
            return saved ? JSON.parse(saved) : [];
          });
          
          const [auditLogs, setAuditLogs] = useState(() => {
            const saved = localStorage.getItem('csva_audit_logs_v1');
            return saved ? JSON.parse(saved) : [];
          });

          const [cloudStatus, setCloudStatus] = useState(db ? 'connecting' : 'offline');
          const [isInitialLoad, setIsInitialLoad] = useState(!!db);
          const isAdmin = user?.email?.toLowerCase() === ADMIN_EMAIL;

          const logAction = (action, details) => {
              const userEmail = auth?.currentUser?.email || 'Usuário Anônimo';
              const newLog = {
                  id: Date.now().toString() + Math.floor(Math.random() * 1000),
                  timestamp: new Date().toISOString(),
                  user: userEmail,
                  action: action,
                  details: details
              };
              
              setAuditLogs(prev => {
                  const updated = [newLog, ...prev];
                  return updated.slice(0, 1000); 
              });
          };

          useEffect(() => {
            if (!auth) {
                setIsAuthChecking(false);
                return;
            }
            let accessUnsubscribe = null;

            const unsubscribe = auth.onAuthStateChanged((u) => {
                if (accessUnsubscribe) {
                    accessUnsubscribe();
                    accessUnsubscribe = null;
                }

                if (!u) {
                    setUser(null);
                    setIsAuthChecking(false);
                    return;
                }

                setIsAuthChecking(true);
                const userEmail = (u.email || '').toLowerCase();

                if (userEmail === ADMIN_EMAIL) {
                    setAccessNotice('');
                    setUser(u);
                    setIsAuthChecking(false);
                    return;
                }

                if (!db) {
                    setAccessNotice('Não foi possível validar a autorização deste usuário.');
                    setUser(null);
                    setIsAuthChecking(false);
                    auth.signOut();
                    return;
                }

                accessUnsubscribe = db.collection(ACCESS_REQUESTS_COLLECTION).doc(u.uid).onSnapshot((docSnap) => {
                    const requestData = docSnap.exists ? docSnap.data() : null;

                    if (requestData?.status === 'approved') {
                        setAccessNotice('');
                        setUser(u);
                        setIsAuthChecking(false);
                        return;
                    }

                    const notices = {
                        pending: 'Sua solicitação ainda está aguardando a aprovação do administrador.',
                        rejected: 'Sua solicitação de acesso não foi aprovada. Procure o administrador.',
                        revoked: 'Seu acesso ao sistema foi revogado pelo administrador.'
                    };
                    setAccessNotice(notices[requestData?.status] || 'Este usuário ainda não possui autorização para acessar o sistema.');
                    setUser(null);
                    setIsAuthChecking(false);
                    auth.signOut();
                }, (error) => {
                    console.error('Erro ao validar autorização:', error);
                    setAccessNotice('Não foi possível validar sua autorização. Tente novamente.');
                    setUser(null);
                    setIsAuthChecking(false);
                    auth.signOut();
                });
            });

            return () => {
                unsubscribe();
                if (accessUnsubscribe) accessUnsubscribe();
            };
          }, []);

          useEffect(() => {
            if (!db || !user) return;
            const fetchData = async () => {
              try {
                setCloudStatus('syncing');
                const docRef = db.collection('sistema_rh_dados').doc('dados_principais');
                const docSnap = await docRef.get();
                
                if (docSnap.exists) {
                   const data = docSnap.data();
                   if (data.employees) setEmployees(data.employees);
                   if (data.records) setRecords(data.records);
                   if (data.punishments) setPunishments(data.punishments);
                   if (data.reminders) setReminders(data.reminders);
                   if (data.auditLogs) setAuditLogs(data.auditLogs);
                }
                setCloudStatus('synced');
              } catch (err) {
                console.error("Erro ao puxar dados da nuvem", err);
                setCloudStatus('error');
              } finally {
                setIsInitialLoad(false);
              }
            };
            fetchData();
          }, [user]);

          useEffect(() => {
            localStorage.setItem('csva_employees_v5', JSON.stringify(employees));
            localStorage.setItem('csva_records_v5', JSON.stringify(records));
            localStorage.setItem('csva_punishments_v5', JSON.stringify(punishments));
            localStorage.setItem('csva_reminders_v1', JSON.stringify(reminders)); 
            localStorage.setItem('csva_audit_logs_v1', JSON.stringify(auditLogs)); 

            if (isInitialLoad || !db || !user) return;

            const saveToCloud = async () => {
              setCloudStatus('syncing');
              try {
                 const docRef = db.collection('sistema_rh_dados').doc('dados_principais');
                 await docRef.set({ employees, records, punishments, reminders, auditLogs, updatedAt: new Date().toISOString() });
                 setCloudStatus('synced');
              } catch (err) {
                 console.error("Erro ao salvar na nuvem", err);
                 setCloudStatus('error');
              }
            };

            const timeoutId = setTimeout(saveToCloud, 1500); 
            return () => clearTimeout(timeoutId);
          }, [employees, records, punishments, reminders, auditLogs, isInitialLoad, user]);

          const toggleRecordStatus = (date, empId, status) => {
            if (!status) return;
            const emp = employees.find(e => e.id === empId);
            
            setRecords(prev => {
              const dayRecords = prev[date] || {};
              let currentStatuses = normalizeStatuses(dayRecords[empId]);
              let isAdding = true;

              if (currentStatuses.includes(status)) {
                currentStatuses = currentStatuses.filter(s => s !== status);
                isAdding = false;
              } else {
                currentStatuses = [...currentStatuses, status];
              }
              
              if(isAdding) logAction('LANÇOU_OCORRÊNCIA', `Adicionou [${status}] para ${emp?.name || empId} no dia ${formatDateBR(date)}`);
              else logAction('REMOVEU_OCORRÊNCIA', `Removeu [${status}] de ${emp?.name || empId} no dia ${formatDateBR(date)}`);

              return { ...prev, [date]: { ...dayRecords, [empId]: currentStatuses.length > 0 ? currentStatuses : null } };
            });
          };

          const applyBulkRecords = (empId, status, startDateStr, endDateStr) => {
            const emp = employees.find(e => e.id === empId);
            logAction('LANÇOU_LICENÇA/FÉRIAS', `Lançou [${status}] para ${emp?.name || empId} do dia ${formatDateBR(startDateStr)} até ${formatDateBR(endDateStr)}`);

            setRecords(prev => {
              const newState = { ...prev };
              let curr = createLocalDate(startDateStr);
              const end = createLocalDate(endDateStr);
              while (curr <= end) {
                const dateStr = toLocalISODate(curr);
                const dayRecords = newState[dateStr] || {};
                let currentStatuses = normalizeStatuses(dayRecords[empId]);
                if (!currentStatuses.includes(status)) {
                  currentStatuses = [...currentStatuses, status];
                }
                newState[dateStr] = { ...dayRecords, [empId]: currentStatuses };
                curr.setDate(curr.getDate() + 1);
              }
              return newState;
            });
          };

          const clearFutureRecords = (empId, returnDateStr) => {
            const emp = employees.find(e => e.id === empId);
            logAction('REGISTROU_RETORNO', `Limpou licenças/atestados de ${emp?.name || empId} a partir de ${formatDateBR(returnDateStr)}`);

            setRecords(prev => {
              const newState = { ...prev };
              Object.keys(newState).forEach(dateStr => {
                if (dateStr >= returnDateStr) {
                   const dayRecords = newState[dateStr];
                   if (dayRecords && dayRecords[empId]) {
                      let statuses = normalizeStatuses(dayRecords[empId]);
                      statuses = statuses.filter(s => s !== 'FE' && s !== 'ATS' && s !== 'INSS');
                      newState[dateStr] = { ...dayRecords, [empId]: statuses.length > 0 ? statuses : null };
                   }
                }
              });
              return newState;
            });
          };

          const handleLogout = () => {
              if(auth) auth.signOut();
          };

          if (isAuthChecking) {
            return (
              <div className="flex h-screen items-center justify-center bg-slate-900 flex-col gap-4 text-white">
                <Activity className="w-12 h-12 text-blue-500 animate-pulse" />
                <h2 className="text-xl font-bold">Verificando Credenciais...</h2>
              </div>
            );
          }

          if (!user) {
              return <LoginScreen systemNotice={accessNotice} />;
          }

          if (user && isInitialLoad && db) {
            return (
              <div className="flex h-screen items-center justify-center bg-slate-900 flex-col gap-4 text-white">
                <Activity className="w-12 h-12 text-blue-500 animate-pulse" />
                <h2 className="text-xl font-bold">Carregando Banco de Dados...</h2>
                <p className="text-slate-400 text-sm">Sincronizando informações da nuvem.</p>
              </div>
            );
          }

          return (
            <div className="flex h-screen bg-gray-50 font-sans text-gray-900">
              <aside className="w-64 bg-slate-900 text-slate-300 flex flex-col shadow-xl z-20 shrink-0">
                <div className="p-6 bg-slate-950 flex items-center space-x-3">
                  <Activity className="text-blue-500 w-8 h-8" />
                  <div>
                    <h1 className="text-white font-bold text-lg leading-tight">CSVA RH</h1>
                    <p className="text-xs text-slate-500">Controle Operacional</p>
                  </div>
                </div>
                <nav className="flex-1 py-4 overflow-y-auto">
                  <MenuButton icon={Home} label="Dashboard" active={activeTab === 'dashboard'} onClick={() => setActiveTab('dashboard')} />
                  <MenuButton icon={CalendarDays} label="Ocorrências Diárias" active={activeTab === 'lancamento'} onClick={() => setActiveTab('lancamento')} />
                  <MenuButton icon={CalendarRange} label="Férias e Licenças" active={activeTab === 'licencas'} onClick={() => setActiveTab('licencas')} />
                  <MenuButton icon={Calendar} label="Mapa de Férias" active={activeTab === 'mapa-ferias'} onClick={() => setActiveTab('mapa-ferias')} />
                  <MenuButton icon={LayoutGrid} label="Relatório do Ciclo" active={activeTab === 'relatorio'} onClick={() => setActiveTab('relatorio')} />
                  <MenuButton icon={ShieldAlert} label="Controle de Punição" active={activeTab === 'punicao'} onClick={() => setActiveTab('punicao')} />
                  <MenuButton icon={Users} label="Funcionários" active={activeTab === 'funcionarios'} onClick={() => setActiveTab('funcionarios')} />
                  <div className="mt-4 mb-2 px-6 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Gestão e Produtividade</div>
                  <MenuButton icon={ListTodo} label="Lembretes e Tarefas" active={activeTab === 'lembretes'} onClick={() => setActiveTab('lembretes')} />
                  <div className="mt-4 mb-2 px-6 text-[10px] font-bold text-slate-500 uppercase tracking-wider">Sistema</div>
                  {isAdmin && <MenuButton icon={UserCheck} label="Acessos" active={activeTab === 'acessos'} onClick={() => setActiveTab('acessos')} />}
                  <MenuButton icon={ClipboardList} label="Histórico de Ações" active={activeTab === 'auditoria'} onClick={() => setActiveTab('auditoria')} />
                  <MenuButton icon={Database} label="Backup e Dados" active={activeTab === 'backup'} onClick={() => setActiveTab('backup')} />
                </nav>
                
                <div className="p-4 text-xs text-slate-400 border-t border-slate-800 text-center flex flex-col items-center bg-slate-950/50">
                  {cloudStatus === 'syncing' && <span className="text-blue-400 flex items-center gap-1 font-bold"><UploadCloud className="w-3.5 h-3.5 animate-bounce"/> A guardar...</span>}
                  {cloudStatus === 'synced' && <span className="text-emerald-500 flex items-center gap-1 font-bold"><Cloud className="w-3.5 h-3.5"/> Salvo na Nuvem</span>}
                  {cloudStatus === 'error' && <span className="text-red-500 flex items-center gap-1 font-bold"><AlertCircle className="w-3.5 h-3.5"/> Erro de Conexão</span>}
                  {cloudStatus === 'offline' && <span className="text-gray-500 flex items-center gap-1 font-bold"><CloudOff className="w-3.5 h-3.5"/> Offline</span>}
                </div>

                <button onClick={handleLogout} className="w-full flex items-center justify-center px-6 py-4 text-sm font-bold text-red-400 hover:bg-red-500 hover:text-white transition-colors border-t border-slate-800">
                  <LogOut className="w-5 h-5 mr-2" /> Sair do Sistema
                </button>
              </aside>

              <main className="flex-1 overflow-x-hidden overflow-y-auto bg-gray-50">
                <div className="p-4 sm:p-6 lg:p-8 w-full max-w-full mx-auto">
                  {activeTab === 'dashboard' && <DashboardView employees={employees} records={records} reminders={reminders} />}
                  {activeTab === 'lancamento' && <DailyEntryView employees={employees} records={records} onToggle={toggleRecordStatus} applyBulkRecords={applyBulkRecords} />}
                  {activeTab === 'licencas' && <LeavesView employees={employees} applyBulkRecords={applyBulkRecords} clearFutureRecords={clearFutureRecords} logAction={logAction} />}
                  {activeTab === 'mapa-ferias' && <VacationMapView />}
                  {activeTab === 'relatorio' && <CycleReportView employees={employees} records={records} />}
                  {activeTab === 'punicao' && <PunishmentView employees={employees} punishments={punishments} setPunishments={setPunishments} logAction={logAction} />}
                  {activeTab === 'funcionarios' && <EmployeesView employees={employees} setEmployees={setEmployees} records={records} logAction={logAction} />}
                  {activeTab === 'lembretes' && <RemindersView employees={employees} reminders={reminders} setReminders={setReminders} logAction={logAction} />}
                  {activeTab === 'acessos' && isAdmin && <AccessManagementView logAction={logAction} />}
                  {activeTab === 'auditoria' && <AuditLogView logs={auditLogs} />}
                  {activeTab === 'backup' && <BackupView employees={employees} records={records} punishments={punishments} reminders={reminders} auditLogs={auditLogs} setEmployees={setEmployees} setRecords={setRecords} setPunishments={setPunishments} setReminders={setReminders} cloudStatus={cloudStatus} />}
                </div>
              </main>
            </div>
          );
        }

        // --- SUB-COMPONENTES ---
        function MenuButton({ icon: Icon, label, active, onClick }) {
          return (
            <button onClick={onClick} className={`w-full flex items-center px-6 py-3 text-sm font-medium transition-colors duration-200 ${active ? 'bg-blue-600 text-white border-r-4 border-blue-400' : 'hover:bg-slate-800 hover:text-white'}`}>
              <Icon className="w-5 h-5 mr-3" /> {label}
            </button>
          );
        }

        function VacationMapView() {
          return (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden h-[calc(100vh-4rem)] min-h-[620px] animate-fade-in">
              <iframe
                src="./mapa-ferias.html"
                title="Mapa de Férias Pro"
                className="w-full h-full border-0 bg-gray-50"
                loading="eager"
              />
            </div>
          );
        }

        function AccessManagementView({ logAction }) {
          const [requests, setRequests] = useState([]);
          const [loading, setLoading] = useState(true);
          const [error, setError] = useState('');
          const [processingId, setProcessingId] = useState(null);

          useEffect(() => {
            if (!db || auth?.currentUser?.email?.toLowerCase() !== ADMIN_EMAIL) {
              setError('Área disponível somente para o administrador.');
              setLoading(false);
              return;
            }

            const unsubscribe = db.collection(ACCESS_REQUESTS_COLLECTION).onSnapshot((snapshot) => {
              const list = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
              list.sort((a, b) => {
                const dateA = a.requestedAt?.toMillis?.() || new Date(a.requestedAtIso || 0).getTime();
                const dateB = b.requestedAt?.toMillis?.() || new Date(b.requestedAtIso || 0).getTime();
                return dateB - dateA;
              });
              setRequests(list);
              setError('');
              setLoading(false);
            }, (snapshotError) => {
              console.error('Erro ao carregar solicitações:', snapshotError);
              setError('Não foi possível carregar as solicitações de acesso.');
              setLoading(false);
            });

            return () => unsubscribe();
          }, []);

          const updateAccessStatus = async (request, newStatus) => {
            if (auth?.currentUser?.email?.toLowerCase() !== ADMIN_EMAIL) return;
            setProcessingId(request.id);
            setError('');

            try {
              await db.collection(ACCESS_REQUESTS_COLLECTION).doc(request.id).update({
                status: newStatus,
                decisionAt: firebase.firestore.FieldValue.serverTimestamp(),
                decisionAtIso: new Date().toISOString(),
                decisionBy: ADMIN_EMAIL
              });
              logAction(
                newStatus === 'approved' ? 'APROVOU_ACESSO' : 'RECUSOU_ACESSO',
                `${newStatus === 'approved' ? 'Aprovou' : 'Recusou'} o acesso de ${request.email}`
              );
            } catch (actionError) {
              console.error('Erro ao atualizar acesso:', actionError);
              setError('Não foi possível atualizar este acesso. Tente novamente.');
            } finally {
              setProcessingId(null);
            }
          };

          const deleteAccess = async (request) => {
            if (auth?.currentUser?.email?.toLowerCase() !== ADMIN_EMAIL) return;
            const confirmed = window.confirm(`Excluir o acesso de ${request.email}? A pessoa será impedida de entrar no sistema.`);
            if (!confirmed) return;

            setProcessingId(request.id);
            setError('');
            try {
              await db.collection(ACCESS_REQUESTS_COLLECTION).doc(request.id).delete();
              logAction('EXCLUIU_ACESSO', `Excluiu e revogou o acesso de ${request.email}`);
            } catch (actionError) {
              console.error('Erro ao excluir acesso:', actionError);
              setError('Não foi possível excluir este acesso. Tente novamente.');
            } finally {
              setProcessingId(null);
            }
          };

          const formatRequestDate = (request) => {
            const date = request.requestedAt?.toDate?.() || (request.requestedAtIso ? new Date(request.requestedAtIso) : null);
            return date && !Number.isNaN(date.getTime()) ? date.toLocaleString('pt-BR') : 'Aguardando registro';
          };

          const statusDefinitions = {
            pending: { label: 'Aguardando', classes: 'bg-amber-100 text-amber-800 border-amber-200' },
            approved: { label: 'Aprovado', classes: 'bg-emerald-100 text-emerald-800 border-emerald-200' },
            rejected: { label: 'Recusado', classes: 'bg-red-100 text-red-700 border-red-200' }
          };

          const pendingCount = requests.filter(request => request.status === 'pending').length;
          const approvedCount = requests.filter(request => request.status === 'approved').length;

          return (
            <div className="space-y-6 animate-fade-in pb-10">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="p-4 bg-blue-100 text-blue-600 rounded-xl shrink-0"><UserCheck className="w-8 h-8" /></div>
                  <div>
                    <h2 className="text-2xl font-bold text-gray-800">Controle de Acessos</h2>
                    <p className="text-sm text-gray-500 mt-1">Aprove, recuse ou exclua as solicitações de entrada no sistema.</p>
                  </div>
                </div>
                <div className="flex gap-3">
                  <div className="px-4 py-2.5 rounded-xl bg-amber-50 border border-amber-200 text-center">
                    <p className="text-2xl font-extrabold text-amber-700">{pendingCount}</p>
                    <p className="text-[10px] font-bold text-amber-600 uppercase">Aguardando</p>
                  </div>
                  <div className="px-4 py-2.5 rounded-xl bg-emerald-50 border border-emerald-200 text-center">
                    <p className="text-2xl font-extrabold text-emerald-700">{approvedCount}</p>
                    <p className="text-[10px] font-bold text-emerald-600 uppercase">Aprovados</p>
                  </div>
                </div>
              </div>

              {error && (
                <div className="bg-red-50 text-red-700 p-4 rounded-xl border border-red-200 flex items-center gap-2 font-medium">
                  <AlertTriangle className="w-5 h-5 shrink-0" /> {error}
                </div>
              )}

              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="px-6 py-4 border-b border-gray-100 bg-slate-50">
                  <h3 className="font-bold text-gray-800 flex items-center gap-2"><KeyRound className="w-5 h-5 text-blue-600" /> Usuários e Solicitações</h3>
                </div>

                {loading ? (
                  <div className="p-12 flex flex-col items-center justify-center text-slate-500 gap-3">
                    <Activity className="w-8 h-8 text-blue-500 animate-spin" />
                    <p className="font-medium">Carregando acessos...</p>
                  </div>
                ) : requests.length === 0 ? (
                  <div className="p-12 text-center text-slate-500">
                    <UserPlus className="w-12 h-12 text-slate-300 mx-auto mb-3" />
                    <p className="font-bold text-slate-700">Nenhuma solicitação recebida</p>
                    <p className="text-sm mt-1">Os pedidos feitos na tela de login aparecerão aqui.</p>
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead className="bg-slate-100 text-slate-600 text-xs uppercase tracking-wider">
                        <tr>
                          <th className="p-4 font-bold border-b">Usuário</th>
                          <th className="p-4 font-bold border-b">Solicitado em</th>
                          <th className="p-4 font-bold border-b text-center">Situação</th>
                          <th className="p-4 font-bold border-b text-right">Ações</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y divide-gray-100">
                        {requests.map(request => {
                          const status = statusDefinitions[request.status] || statusDefinitions.pending;
                          const isProcessing = processingId === request.id;
                          return (
                            <tr key={request.id} className="hover:bg-slate-50 transition-colors">
                              <td className="p-4">
                                <div className="flex items-center gap-3">
                                  <div className="w-10 h-10 rounded-full bg-blue-100 text-blue-700 flex items-center justify-center font-bold shrink-0">{request.email?.charAt(0).toUpperCase() || '?'}</div>
                                  <div>
                                    <p className="font-bold text-slate-800">{request.email}</p>
                                    <p className="text-xs text-slate-400">Domínio corporativo CSVA</p>
                                  </div>
                                </div>
                              </td>
                              <td className="p-4 text-sm font-medium text-slate-600 whitespace-nowrap">{formatRequestDate(request)}</td>
                              <td className="p-4 text-center"><span className={`inline-flex px-3 py-1 rounded-full text-xs font-bold border ${status.classes}`}>{status.label}</span></td>
                              <td className="p-4">
                                <div className="flex items-center justify-end gap-2">
                                  {request.status !== 'approved' && (
                                    <button disabled={isProcessing} onClick={() => updateAccessStatus(request, 'approved')} className="px-3 py-2 rounded-lg bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white text-xs font-bold transition flex items-center gap-1.5"><CheckCircle2 className="w-4 h-4" /> Aceitar</button>
                                  )}
                                  {request.status === 'pending' && (
                                    <button disabled={isProcessing} onClick={() => updateAccessStatus(request, 'rejected')} className="px-3 py-2 rounded-lg bg-amber-100 hover:bg-amber-200 disabled:opacity-50 text-amber-800 text-xs font-bold border border-amber-200 transition flex items-center gap-1.5"><UserX className="w-4 h-4" /> Recusar</button>
                                  )}
                                  <button disabled={isProcessing} onClick={() => deleteAccess(request)} className="px-3 py-2 rounded-lg bg-red-50 hover:bg-red-100 disabled:opacity-50 text-red-700 text-xs font-bold border border-red-200 transition flex items-center gap-1.5"><UserMinus className="w-4 h-4" /> Excluir</button>
                                </div>
                              </td>

        function DashboardView({ employees, records, reminders }) {
          const todayStr = toLocalISODate(new Date());
          const activeCount = employees.filter(e => e.status === 'Ativo').length;
          const todaysRecords = records[todayStr] || {};
          
          let absentToday = 0; let medicalToday = 0; let totalExceptions = 0; const peopleOnINSS = []; 

          Object.entries(todaysRecords).forEach(([empId, data]) => {
            const emp = employees.find(e => e.id === empId);
            // GARANTIR QUE SÓ VAI CONTAR QUEM FOR ATIVO HOJE:
            if (emp && emp.status === 'Ativo') {
                const statuses = normalizeStatuses(data);
                if (statuses.length > 0) {
                    totalExceptions++;
                    
                    if (statuses.some(s => s === 'FT' || s.startsWith('FT:'))) {
                        absentToday++;
                    }
                    
                    if (statuses.some(s => s === 'ATS' || s.startsWith('ATS:') || s === 'ATSC' || s.startsWith('ATSC:') || s === 'INSS' || s.startsWith('INSS:'))) {
                        medicalToday++;
                    }
                    
                    if (statuses.some(s => s === 'INSS' || s.startsWith('INSS:'))) {
                        peopleOnINSS.push(emp);
                    }
                }
            }
          });
          
          const pendingTasks = reminders.filter(r => r.status === 'PENDING' || r.status === 'IN_PROGRESS').length;
          const [showINSSModal, setShowINSSModal] = useState(false);

          return (
            <div className="space-y-6 animate-fade-in pb-10">

                <StatCard title="Com Ocorrências" value={totalExceptions} icon={Activity} color="bg-indigo-500" />
                <StatCard title="Com Faltas" value={absentToday} icon={AlertTriangle} color="bg-red-500" />

                      ) : (

                            <div key={emp.id} className="flex items-center gap-3 p-3 bg-gray-50 hover:bg-purple-50/50 rounded-lg border border-gray-100 transition-colors">

          const activeEmployees = [...employees].filter(e => e.status === 'Ativo').sort((a, b) => (a.name || '').localeCompare(b.name || ''));

          const [days, setDays] = useState('30');
          const [endDate, setEndDate] = useState('');
          const [successMsg, setSuccessMsg] = useState('');

          const [returnEmpId, setReturnEmpId] = useState('');
          const [returnDate, setReturnDate] = useState(toLocalISODate(new Date()));
          const [returnSuccessMsg, setReturnSuccessMsg] = useState('');

          const [bulkData, setBulkData] = useState('');
          const [bulkLeaveType, setBulkLeaveType] = useState('FE');
          const [bulkSuccessMsg, setBulkSuccessMsg] = useState('');

          useEffect(() => {
            if (startDate && days) {
              const d = createLocalDate(startDate);
              d.setDate(d.getDate() + (parseInt(days || 1) - 1));
              setEndDate(toLocalISODate(d));
            }
          }, [startDate, days]);

          const handleEndDateChange = (val) => {
            setEndDate(val);
            if (startDate && val) {
              const start = createLocalDate(startDate);
              const end = createLocalDate(val);
              const diffTime = end - start;
              const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
              setDays(diffDays > 0 ? diffDays.toString() : '1');
            }
          };

          const handleApplyLeave = () => {
            if (!empId || !leaveType || !startDate || !endDate) return;
            applyBulkRecords(empId, leaveType, startDate, endDate);
            const emp = activeEmployees.find(e => e.id === empId);
            setSuccessMsg(`✅ ${leaveType} lançado(s) para ${emp.name} de ${formatDateBR(startDate)} até ${formatDateBR(endDate)}.`);
            setTimeout(() => setSuccessMsg(''), 5000);
            setEmpId('');
          };

          const handleApplyReturn = () => {
            if (!returnEmpId || !returnDate) return;
            clearFutureRecords(returnEmpId, returnDate);
            const emp = activeEmployees.find(e => e.id === returnEmpId);
            setReturnSuccessMsg(`✅ Retorno registrado! Licenças apagadas a partir de ${formatDateBR(returnDate)} para ${emp.name}.`);
            setTimeout(() => setReturnSuccessMsg(''), 5000);
            setReturnEmpId('');
          };

          const handleProcessBulk = () => {
            if (!bulkData.trim()) return;
            
            const rawLines = bulkData.split('\n').map(l => l.trim()).filter(l => l !== '');
            let recordsToApply = [];
            let successCount = 0;

            let currentEmpId = null;
            let currentDates = [];

            for (let i = 0; i < rawLines.length; i++) {
                const line = rawLines[i];

                if (/^\d+$/.test(line)) {
                    if (currentEmpId && currentDates.length >= 2) {
                        recordsToApply.push({ id: currentEmpId, inicio: currentDates[currentDates.length - 2], termino: currentDates[currentDates.length - 1] });
                    }
                    currentEmpId = line;
                    currentDates = [];
                } else {
                    const extractedDate = extractDateFromText(line);
                    if (extractedDate) { currentDates.push(extractedDate); }
                }
            }

            if (currentEmpId && currentDates.length >= 2) {
                recordsToApply.push({ id: currentEmpId, inicio: currentDates[currentDates.length - 2], termino: currentDates[currentDates.length - 1] });
            }

            recordsToApply.forEach(rec => {
              const emp = activeEmployees.find(e => e.id === rec.id || Number(e.id) === Number(rec.id));
              if (emp) { applyBulkRecords(emp.id, bulkLeaveType, rec.inicio, rec.termino); successCount++; }
            });

            if (successCount === 0) {
                setBulkSuccessMsg("⚠️ Nenhuma informação correspondente encontrada. Verifique se as matrículas e as datas estão corretas.");
            } else {
                setBulkSuccessMsg(`✅ ${successCount} funcionário(s) atualizado(s) com ${bulkLeaveType} com sucesso!`);

            setBulkData('');

          return (

                  <button className={`flex-1 py-3 text-sm font-bold transition flex items-center justify-center gap-2 ${isBulkImport ? 'bg-teal-50 text-teal-700 border-b-2 border-teal-600' : 'bg-white text-gray-500 hover:bg-gray-50'}`} onClick={() => setIsBulkImport(true)}><Upload className="w-4 h-4" /> Colar do E-mail</button>
                </div>
              </div>
              {!isBulkImport ? (
                <div className="grid grid-cols-1 lg:grid-cols-2 gap-6 animate-fade-in">
                  <div className="bg-white border border-blue-200 shadow-sm rounded-xl overflow-hidden flex flex-col">
                    <div className="bg-blue-50 px-6 py-4 border-b border-blue-100"><h3 className="font-bold text-blue-800 flex items-center gap-2"><CalendarClock className="w-5 h-5" /> 1. Lançar Novo Período</h3></div>
                    <div className="p-6 flex-1 flex flex-col gap-5">
                      <div>

                        <select className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={empId} onChange={e => setEmpId(e.target.value)}>
                          <option value="">-- Selecione --</option>

                        </select>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div>

                          <select className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={leaveType} onChange={e => { setLeaveType(e.target.value); if (e.target.value === 'ATS') setDays('1'); else if (e.target.value === 'INSS') setDays('60'); else setDays('30'); }}>
                            <option value="FE">Férias</option><option value="INSS">Afastamento INSS</option><option value="ATS">Atestado Prolongado</option>

                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Data Início</label><input type="date" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={startDate} onChange={e => setStartDate(e.target.value)} /></div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Quantidade de Dias</label><input type="number" min="1" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={days} onChange={e => setDays(e.target.value)} /></div>
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Data Final</label><input type="date" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={endDate} onChange={e => handleEndDateChange(e.target.value)} /></div>
                      </div>
                      <div className="mt-auto pt-4">
                        <button onClick={handleApplyLeave} disabled={!empId || !leaveType || !startDate || !endDate} className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white py-3 rounded-lg font-bold transition flex items-center justify-center shadow-md">Aplicar na Folha</button>
                        {successMsg && <div className="mt-3 text-sm text-green-700 bg-green-50 p-3 rounded border border-green-200">{successMsg}</div>}
                      </div>

                  </div>
                  <div className="bg-white border border-emerald-200 shadow-sm rounded-xl overflow-hidden flex flex-col">
                    <div className="bg-emerald-50 px-6 py-4 border-b border-emerald-100"><h3 className="font-bold text-emerald-800 flex items-center gap-2"><Undo2 className="w-5 h-5" /> 2. Registrar Retorno ao Trabalho</h3></div>
                    <div className="p-6 flex-1 flex flex-col gap-5">
                      <p className="text-sm text-gray-600">Se o funcionário voltar do INSS ou Férias mais cedo do que o esperado, informe a data em que ele retomou o trabalho. O sistema irá <strong>apagar</strong> automaticamente todas as licenças lançadas a partir da data informada.</p>
                      <div>

                          <option value="">-- Selecione --</option>
                          {activeEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}
                        </select>
                      </div>
                      <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Data de Retorno ao Trabalho</label><input type="date" className="w-full border border-gray-300 rounded-lg p-2.5 outline-none focus:ring-2 focus:ring-emerald-500 text-sm shadow-sm" value={returnDate} onChange={e => setReturnDate(e.target.value)} /></div>

                        <button onClick={handleApplyReturn} disabled={!returnEmpId || !returnDate} className="w-full bg-emerald-600 hover:bg-emerald-700 disabled:opacity-50 text-white py-3 rounded-lg font-bold transition flex items-center justify-center shadow-md">Registrar Retorno e Limpar Folha</button>

        function DailyEntryView({ employees, records, onToggle, applyBulkRecords }) {
          const [selectedDate, setSelectedDate] = useState(toLocalISODate(new Date()));
          const [selectedShift, setSelectedShift] = useState('');
          const [selectedEmpId, setSelectedEmpId] = useState('');
          const [selectedStatus, setSelectedStatus] = useState('');
          const [customText, setCustomText] = useState(''); 
          const [tfgDate, setTfgDate] = useState('');
          const [actionDays, setActionDays] = useState(1); 

          const activeEmployees = employees.filter(e => e.status === 'Ativo');

          useEffect(() => {
            if (selectedStatus === 'INSS') { setActionDays(180); } 
            else if (selectedStatus === 'ATS' || selectedStatus === 'SUP' || selectedStatus === 'FE') { setActionDays(1); } 
            else { setActionDays(1); }
          }, [selectedStatus]);

          const availableShifts = useMemo(() => {
            const shifts = new Set(activeEmployees.map(e => e.shift || 'Geral'));
            return Array.from(shifts).sort();
          }, [activeEmployees]);

          const availableSchedules = useMemo(() => {
            const schedules = new Set(activeEmployees.map(e => e.schedule).filter(s => s && s !== 'A Definir' && s !== 'Não definido'));
            return Array.from(schedules).sort();
          }, [activeEmployees]);

          const employeesToSelect = useMemo(() => {
            let filtered = activeEmployees;
            if (selectedShift) { filtered = filtered.filter(e => (e.shift || 'Geral') === selectedShift); }
            return filtered.sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          }, [activeEmployees, selectedShift]);

          const employeesWithOccurrences = useMemo(() => {
            const todaysRecords = records[selectedDate] || {};
            return activeEmployees.filter(emp => {
              const statuses = normalizeStatuses(todaysRecords[emp.id]);
              return statuses.length > 0;
            });
          }, [activeEmployees, records, selectedDate]);

          const handleLaunchOccurrence = () => {
            let finalStatus = selectedStatus;
            
            if (selectedStatus === 'TH') {
              if (!customText.trim()) return;
              finalStatus = `TH: ${customText.trim()}`;
            } else if (selectedStatus === 'TFG') {
              if (!tfgDate) {
                  alert("Por favor, selecione a data em que o funcionário irá folgar.");
                  return;
              }
              finalStatus = `TFG: folga dia ${formatDateBR(tfgDate)}`;
            }

            if (!selectedEmpId || !finalStatus || !selectedDate) return;

            if (['ATS', 'SUP', 'INSS', 'FE'].includes(selectedStatus) && actionDays > 1) {
              const start = createLocalDate(selectedDate);
              const end = createLocalDate(selectedDate);
              end.setDate(end.getDate() + actionDays - 1);
              const endStr = toLocalISODate(end);
              applyBulkRecords(selectedEmpId, finalStatus, selectedDate, endStr);
            } else {
              onToggle(selectedDate, selectedEmpId, finalStatus);
            }

            setSelectedStatus(''); setCustomText(''); setTfgDate(''); setSelectedEmpId(''); setActionDays(1);
          };

          const currentStatusesOfSelected = selectedEmpId ? normalizeStatuses(records[selectedDate]?.[selectedEmpId]) : [];
          const hasStatus = (code, statuses) => statuses.some(s => s === code || s.startsWith(`${code}:`));

          return (
            <div className="space-y-6 animate-fade-in pb-10">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div><h2 className="text-2xl font-bold text-gray-800">Lançamento de Ocorrências Diárias</h2><p className="text-sm text-gray-500">Selecione a data, busque o funcionário e registre as ocorrências. Atestados e suspensões podem durar vários dias.</p></div>
              </div>

              <div className="bg-white border border-blue-200 shadow-sm rounded-xl overflow-visible">
                <div className="bg-blue-50 px-6 py-4 border-b border-blue-100 flex items-center gap-2"><Filter className="w-5 h-5 text-blue-600" /><h3 className="font-bold text-blue-800">Localizar e Lançar Divergência</h3></div>
                <div className="p-6">
                  <div className="flex flex-col lg:flex-row gap-4 items-start">
                    <div className="flex-[1.2] w-full"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">1. Data Inicial</label><input type="date" className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={selectedDate} onChange={(e) => setSelectedDate(e.target.value)} /></div>
                    <div className="flex-1 w-full"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">2. Turno</label><select className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={selectedShift} onChange={(e) => { setSelectedShift(e.target.value); setSelectedEmpId(''); }}><option value="">-- Todos --</option>{availableShifts.map(shift => <option key={shift} value={shift}>{shift}</option>)}</select></div>
                    <div className="flex-[2] w-full"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">3. Funcionário</label><select className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm disabled:bg-gray-100" value={selectedEmpId} onChange={(e) => setSelectedEmpId(e.target.value)}><option value="">-- Selecione quem teve ocorrência --</option>{employeesToSelect.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}</select></div>
                    <div className="flex-[1.5] w-full">
                      <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">4. Ocorrência</label>
                      <div className="flex flex-col gap-2">
                        <select className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm disabled:bg-gray-100" value={selectedStatus} onChange={(e) => setSelectedStatus(e.target.value)} disabled={!selectedEmpId}><option value="">-- Selecione --</option>{Object.entries(STATUS_DICT).filter(([code]) => !hasStatus(code, currentStatusesOfSelected)).map(([code, data]) => <option key={code} value={code}>{code} - {data.label}</option>)}</select>
                        
                        {selectedStatus === 'TH' && (<select className="w-full border border-blue-400 bg-blue-50 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm animate-fade-in text-blue-900 font-medium" value={customText} onChange={(e) => setCustomText(e.target.value)}><option value="">-- Selecione o novo horário --</option>{availableSchedules.map(sched => <option key={sched} value={sched}>{sched}</option>)}</select>)}
                        
                        {selectedStatus === 'TFG' && (
                            <div className="animate-fade-in">
                                <label className="block text-[11px] font-bold text-indigo-600 uppercase tracking-wide mb-1.5">Data que irá folgar:</label>
                                <input type="date" className="w-full border border-indigo-400 bg-indigo-50 rounded-lg p-3 outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm text-indigo-900 font-medium" value={tfgDate} onChange={(e) => setTfgDate(e.target.value)} />
                            </div>
                        )}
                      </div>
                    </div>
                    {['ATS', 'SUP', 'INSS', 'FE'].includes(selectedStatus) && (<div className="flex-[0.8] w-full animate-fade-in"><label className="block text-[11px] font-bold text-blue-600 uppercase tracking-wide mb-1.5">Qtd. Dias</label><input type="number" min="1" className="w-full border-2 border-blue-300 bg-blue-50 text-blue-900 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm font-bold" value={actionDays} onChange={(e) => setActionDays(Number(e.target.value))} title={selectedStatus === 'INSS' ? 'O INSS é lançado por vários dias automaticamente.' : 'Quantos dias durará?'}/></div>)}
                    <div className="flex items-end w-full lg:w-auto mt-auto"><button onClick={handleLaunchOccurrence} disabled={!selectedEmpId || !selectedStatus} className="w-full lg:w-auto bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white px-6 py-3 rounded-lg font-bold transition flex items-center justify-center shadow-md h-[46px]"><Plus className="w-5 h-5 mr-1" /> Lançar</button></div>
                  </div>
                  {selectedStatus === 'INSS' && (<p className="text-xs text-blue-600 mt-3 font-medium bg-blue-50 p-2 rounded inline-block">ℹ️ O INSS será lançado na folha pelos próximos {actionDays} dias automaticamente. Quando o funcionário voltar, use a aba "Férias e Licenças" para registrar o retorno.</p>)}
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="px-6 py-4 border-b border-gray-100 flex items-center justify-between bg-slate-50"><h3 className="font-bold text-gray-800">Divergências Registradas no dia: <span className="text-blue-600">{formatDateBR(selectedDate)}</span></h3><span className="bg-white text-slate-600 px-3 py-1 rounded-full text-xs font-bold border border-slate-200">{employeesWithOccurrences.length} Registros</span></div>
                {employeesWithOccurrences.length === 0 ? (
                  <div className="p-12 text-center flex flex-col items-center justify-center bg-green-50/30"><div className="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mb-4 shadow-sm border border-green-200"><CheckCircle2 className="w-8 h-8" /></div><h3 className="text-xl font-bold text-green-800">100% Trabalhando!</h3><p className="text-green-600 text-sm mt-1 max-w-sm">Nenhuma divergência registrada para este dia. Todos os funcionários ativos estão cumprindo sua escala normalmente.</p></div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead className="bg-gray-100 text-gray-500 text-xs uppercase tracking-wider"><tr><th className="p-4 font-bold border-b w-1/3">Funcionário</th><th className="p-4 font-bold border-b w-1/6 text-center">Turno</th><th className="p-4 font-bold border-b w-1/2">Ocorrências do Dia</th></tr></thead>
                      <tbody className="divide-y divide-gray-100">
                        {employeesWithOccurrences.map(emp => {
                          const currentStatuses = normalizeStatuses(records[selectedDate]?.[emp.id]);
                          return (
                            <tr key={emp.id} className="hover:bg-slate-50 transition">
                              <td className="p-4"><div className="font-bold text-gray-800 whitespace-normal break-words">{emp.name}</div><div className="text-[11px] text-gray-400 mt-0.5">{emp.role}</div></td>
                              <td className="p-4 text-center"><span className="bg-slate-100 text-slate-700 px-2 py-1 rounded text-[10px] font-bold border border-slate-200">{emp.shift || 'Geral'}</span></td>
                              <td className="p-4">
                                <div className="flex flex-wrap items-center gap-2">
                                  {currentStatuses.map(status => {
                                    const hasDetails = status.includes(':');
                                    const baseCode = hasDetails ? status.split(':')[0].trim() : status;
                                    const details = hasDetails ? status.substring(status.indexOf(':') + 1).trim() : '';
                                    const dict = STATUS_DICT[baseCode];
                                    
                                    if (dict) {
                                      const displayLabel = hasDetails ? `${baseCode} - ${details}` : `${status} - ${dict.label}`;
                                      return <span key={status} className={`flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border cursor-pointer transition shadow-sm ${dict.color}`} onClick={() => onToggle(selectedDate, emp.id, status)} title="Clique para remover">{displayLabel} <X className="w-3.5 h-3.5 ml-1 opacity-70 hover:opacity-100" /></span>;
                                    } else {
                                      return <span key={status} className="flex items-center gap-1 px-3 py-1.5 rounded-full text-xs font-bold border border-slate-300 bg-slate-100 text-slate-800 cursor-pointer transition shadow-sm" onClick={() => onToggle(selectedDate, emp.id, status)} title="Clique para remover">{status} <X className="w-3.5 h-3.5 ml-1 opacity-70 hover:opacity-100" /></span>;
                                    }
                                  })}
                                  <select className="p-1.5 text-xs rounded-lg border border-gray-300 bg-white text-gray-600 outline-none focus:ring-2 focus:ring-blue-500 cursor-pointer shadow-sm hover:bg-gray-50 transition" value="" onChange={(e) => onToggle(selectedDate, emp.id, e.target.value)}><option value="" disabled hidden>+ Lançar outra (Siglas)</option>{Object.entries(STATUS_DICT).filter(([code]) => code !== 'TH' && code !== 'TFG' && !hasStatus(code, currentStatuses)).map(([code, data]) => <option key={code} value={code}>{code} - {data.label}</option>)}</select>
                                </div>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            </div>
          );
        }

        function CycleReportView({ employees, records }) {
          const today = new Date();
          let currentMonth = today.getMonth() + 1;
          let currentYear = today.getFullYear();
          if (today.getDate() > 18) { currentMonth += 1; if (currentMonth > 12) { currentMonth = 1; currentYear += 1; } }

          const [cycleMonth, setCycleMonth] = useState(currentMonth);
          const [cycleYear, setCycleYear] = useState(currentYear);

          const dates = useMemo(() => getCycleDates(cycleYear, cycleMonth), [cycleYear, cycleMonth]);
          
          // ORDENAR EM ORDEM ALFABÉTICA (A-Z)
          const activeEmployees = useMemo(() => {
              return employees.filter(e => e.status === 'Ativo').sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          }, [employees]);
          
          const monthNames = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];

          return (
            <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-4 md:p-6 animate-fade-in flex flex-col h-[calc(100vh-4rem)]">
              <div className="flex flex-col md:flex-row justify-between items-center mb-6 shrink-0">
                <div><h2 className="text-2xl font-bold text-gray-800">Folha de Pagamento</h2><p className="text-sm text-gray-500">Período: 19 de {monthNames[cycleMonth === 1 ? 11 : cycleMonth - 2]} a 18 de {monthNames[cycleMonth - 1]}</p></div>
                <div className="flex space-x-2 mt-4 md:mt-0">
                  <select className="border p-2 rounded-lg bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" value={cycleMonth} onChange={(e) => setCycleMonth(Number(e.target.value))}>{monthNames.map((m, i) => <option key={i} value={i+1}>{m}</option>)}</select>
                  <input type="number" className="border p-2 rounded-lg bg-gray-50 w-24 outline-none focus:ring-2 focus:ring-blue-500" value={cycleYear} onChange={(e) => setCycleYear(Number(e.target.value))} />
                </div>
              </div>

              <div className="overflow-x-auto overflow-y-auto flex-1 border rounded-lg shadow-inner">
                <table className="min-w-max w-full text-center border-collapse text-sm">
                  <thead className="sticky top-0 bg-slate-800 text-white z-10 shadow-md">
                    <tr>
                      <th className="p-3 font-semibold text-left sticky left-0 bg-slate-800 z-20 min-w-[200px] shadow-[2px_0_5px_rgba(0,0,0,0.1)]">Funcionário</th>
                      {dates.map(date => <th key={date} className="p-2 font-medium border-l border-slate-700 w-12 text-xs">{date.split('-')[2]}/{date.split('-')[1]}</th>)}
                      <th className="p-3 border-l border-slate-700 bg-red-900 font-bold" title="Faltas">FT</th>
                      <th className="p-3 border-l border-slate-700 bg-yellow-700 font-bold" title="Atestados">ATS</th>
                      <th className="p-3 border-l border-slate-700 bg-blue-800 font-bold" title="Horas Extras">EXT</th>
                    </tr>
                  </thead>
                  <tbody className="bg-white">
                    {activeEmployees.map(emp => {
                      let totalFT = 0; let totalATS = 0; let totalEXT = 0;
                      return (
                        <tr key={emp.id} className="border-b hover:bg-blue-50">
                          <td className="p-3 text-left sticky left-0 bg-white shadow-[2px_0_5px_rgba(0,0,0,0.05)] border-r"><div className="font-bold text-gray-800 whitespace-nowrap">{emp.name}</div></td>
                          {dates.map(date => {
                            const statuses = normalizeStatuses(records[date]?.[emp.id]);
                            if (statuses.some(s => s === 'FT' || s.startsWith('FT:'))) totalFT++;
                            if (statuses.some(s => s === 'ATS' || s.startsWith('ATS:') || s === 'ATSC' || s.startsWith('ATSC:') || s === 'INSS' || s.startsWith('INSS:'))) totalATS++;
                            if (statuses.some(s => s === 'EXT' || s.startsWith('EXT:'))) totalEXT++;
                            
                            return (
                              <td key={date} className="p-1 border-l border-gray-200 align-top">
                                {statuses.length > 0 ? (
                                  <div className="flex flex-col gap-1 items-center justify-center py-1 h-full">
                                    {statuses.map(status => {
                                      const hasDetails = status.includes(':');
                                      const baseCode = hasDetails ? status.split(':')[0].trim() : status;
                                      const details = hasDetails ? status.substring(status.indexOf(':') + 1).trim() : '';
                                      const dict = STATUS_DICT[baseCode];
                                      
                                      if (dict) {
                                        const hoverTitle = hasDetails ? `${dict.label}: ${details}` : dict.label;
                                        const displayText = baseCode;
                                        return <div key={status} className={`text-[10px] font-bold px-1.5 py-0.5 rounded shadow-sm border ${dict.color} ${hasDetails ? 'cursor-help' : ''}`} title={hoverTitle}>{displayText}</div>;
