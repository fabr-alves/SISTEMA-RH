                                      } else {
                                        return <div key={status} className="text-[8px] leading-[10px] font-bold p-[2px] rounded shadow-sm border border-slate-300 bg-slate-100 text-slate-800 w-[42px] break-words text-center" title={status}>{status}</div>;
                                      }
                                    })}
                                  </div>
                                ) : <div className="h-8 flex items-center justify-center text-gray-300">-</div>}
                              </td>
                            );
                          })}
                          <td className="p-2 border-l border-gray-300 font-bold text-red-600 bg-red-50">{totalFT}</td>
                          <td className="p-2 border-l border-gray-300 font-bold text-yellow-600 bg-yellow-50">{totalATS}</td>
                          <td className="p-2 border-l border-gray-300 font-bold text-blue-600 bg-blue-50">{totalEXT}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          );
        }

        function EmployeesView({ employees, setEmployees, records, logAction }) {
          const [newMatricula, setNewMatricula] = useState('');
          const [newName, setNewName] = useState('');
          const [newRole, setNewRole] = useState('');
          const [newShift, setNewShift] = useState('');
          const [newSchedule, setNewSchedule] = useState('');
          const [newAdmissionDate, setNewAdmissionDate] = useState('');
          const [newContact, setNewContact] = useState(''); // Estado para o novo campo de contato
          
          const [searchTerm, setSearchTerm] = useState('');
          const [filterShift, setFilterShift] = useState('');
          const [filterRole, setFilterRole] = useState('');
          const [filterStatus, setFilterStatus] = useState('Ativo');
          const [isBulkImport, setIsBulkImport] = useState(false);
          const [bulkData, setBulkData] = useState('');
          const [editingEmp, setEditingEmp] = useState(null);
          const [historyEmp, setHistoryEmp] = useState(null);
          const [deleteConfirmId, setDeleteConfirmId] = useState(null);

          const availableShifts = useMemo(() => {
            const shifts = new Set(employees.map(e => e.shift || 'Geral'));
            return Array.from(shifts).sort();
          }, [employees]);

          const availableRoles = useMemo(() => {
            const roles = new Set(employees.map(e => e.role || 'Sem cargo'));
            return Array.from(roles).sort();
          }, [employees]);

          const handleShiftChange = (val, setShiftFn, setScheduleFn) => {
            setShiftFn(val);
            const upper = val.trim().toUpperCase();
            if (upper === 'TURNO A') setScheduleFn('07:00 as 15:20');
            else if (upper === 'TURNO B') setScheduleFn('15:00 as 23:20');
            else if (upper === 'TURNO C') setScheduleFn('23:20 as 07:00');
            else if (upper === 'TURNO D') setScheduleFn('07:00 as 17:00/16:00');
          };

          const handleAdd = (e) => {
            e.preventDefault();
            if (!newName.trim() || !newMatricula.trim()) {
              alert("Nome e Matrícula são obrigatórios!");
              return;
            }
            if (employees.some(emp => emp.id === newMatricula.trim())) {
              alert("Já existe um funcionário com esta matrícula!");
              return;
            }
            const newEmp = { 
                id: newMatricula.trim(), 
                name: newName, 
                role: newRole || 'Varredor', 
                shift: newShift || 'Geral', 
                schedule: newSchedule || 'A Definir', 
                admissionDate: newAdmissionDate || '-', 
                supervisor: 'A Definir', 
                contact: newContact || '-', // Salvando o contato
                status: 'Ativo' 
            };
            setEmployees([...employees, newEmp]);
            logAction('CADASTRAR_FUNCIONÁRIO', `Cadastrou o funcionário ${newName} (Matrícula: ${newMatricula})`);
            setNewMatricula(''); setNewName(''); setNewRole(''); setNewShift(''); setNewSchedule(''); setNewAdmissionDate(''); setNewContact('');
          };

          const processImportText = (text) => {
              const lines = text.split('\n');
              let newEmployeesList = []; 
              let added = 0;

              for(let i = 0; i < lines.length; i++) {
                  const line = lines[i].trim();
                  
                  if(!line || line.toLowerCase().includes('enc.resp') || line.toLowerCase().includes('t u r n o') || line.toLowerCase().includes('cargo')) continue;
                  
                  const separator = line.includes('\t') ? '\t' : (line.includes(';') ? ';' : ',');
                  const rawParts = line.split(separator);
                  const cleanParts = rawParts.map(p => p.trim()).filter(p => p !== ''); 
                  
                  if (cleanParts.length >= 5) {
                      const role = cleanParts[cleanParts.length - 1];
                      const name = cleanParts[cleanParts.length - 2];
                      
                      let matId = ''; let rawDate = ''; let schedule = ''; let shift = ''; let supervisor = '';

                      const thirdFromEnd = cleanParts[cleanParts.length - 3];
                      const isDate = (val) => {
                          if (!val) return false;
                          if (val.includes('/')) return true;
                          if (val.includes('-')) return true;
                          if (!isNaN(val) && Number(val) > 43000 && Number(val) < 50000) return true; 
                          return false;
                      };

                      if (isDate(thirdFromEnd)) {
                          rawDate = thirdFromEnd;
                          schedule = cleanParts[cleanParts.length - 4] || '';
                          shift = cleanParts[cleanParts.length - 5] || 'Geral';
                          supervisor = cleanParts[cleanParts.length - 6] || 'A Definir';
                      } else {
                          matId = thirdFromEnd;
                          rawDate = cleanParts[cleanParts.length - 4] || '';
                          schedule = cleanParts[cleanParts.length - 5] || '';
                          shift = cleanParts[cleanParts.length - 6] || 'Geral';
                          supervisor = cleanParts[cleanParts.length - 7] || 'A Definir';
                      }
                      
                      let finalDate = '-';
                      if (rawDate) {
                        if (rawDate.includes('-') && rawDate.split('-')[0].length === 4) { finalDate = rawDate; } 
                        else if (rawDate.includes('/')) {
                           const dParts = rawDate.split('/');
                           if(dParts.length === 3) finalDate = `${dParts[2]}-${dParts[1].padStart(2, '0')}-${dParts[0].padStart(2, '0')}`;
                        } else if (!isNaN(rawDate) && Number(rawDate) > 43000) {
                           const serial = Number(rawDate);
                           const date = new Date(Math.round((serial - 25569) * 86400 * 1000));
                           finalDate = `${date.getUTCFullYear()}-${String(date.getUTCMonth() + 1).padStart(2, '0')}-${String(date.getUTCDate()).padStart(2, '0')}`;
                        }
                      }

                      if(!name || name === '') continue;

                      let empId = matId || 'MAT-' + Math.floor(Math.random() * 10000);
                      
                      newEmployeesList.push({ id: empId, name: name, role: role, shift: shift, schedule: schedule, admissionDate: finalDate, supervisor: supervisor, contact: '-', status: 'Ativo' });
                      added++;
                  }
              }
              
              if (added > 0) {
                  if (window.confirm(`O sistema leu ${added} funcionários com sucesso.\n\nIsto irá SOBRESCREVER E APAGAR o seu quadro de funcionários atual e substituir por esta nova lista. Deseja Continuar?`)) {
                     setEmployees(newEmployeesList);
                     logAction('IMPORTAÇÃO_FUNCIONÁRIOS', `Substituiu o quadro de funcionários inteiro importando ${added} novos registos.`);
                     alert(`✅ Importação concluída com sucesso! ${added} funcionários carregados.`);
                     setIsBulkImport(false); setBulkData('');
                  }
              } else {
                  alert("❌ Nenhum funcionário válido foi encontrado. Verifique se o formato do texto/arquivo contém as colunas necessárias.");
              }
          };

          const handleBulkImport = () => { if (!bulkData.trim()) return; processImportText(bulkData); };

          const handleCsvUpload = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => { processImportText(event.target.result); };
            reader.readAsText(file); e.target.value = null;
          };

          const toggleStatus = (id) => {
            const emp = employees.find(e => e.id === id);
            logAction('MUDANÇA_DE_STATUS', `Mudou o status de ${emp.name} para ${emp.status === 'Ativo' ? 'INATIVO' : 'ATIVO'}`);
            setEmployees(employees.map(e => e.id === id ? { ...e, status: e.status === 'Ativo' ? 'Inativo' : 'Ativo' } : e));
          };

          const handleDeleteEmployee = (id) => {
            const emp = employees.find(e => e.id === id);
            logAction('EXCLUIR_FUNCIONÁRIO', `Apagou definitivamente o funcionário ${emp.name} do sistema.`);
            setEmployees(employees.filter(e => e.id !== id)); setDeleteConfirmId(null);
          };

          const handleDeleteAllEmployees = () => {
            const confirm1 = window.confirm("⚠️ CUIDADO MÁXIMO! Deseja realmente EXCLUIR TODOS os funcionários do sistema?");
            if (confirm1) {
              const confirm2 = window.confirm("Tem certeza absoluta? O seu quadro de funcionários ficará VAZIO.");
              if (confirm2) {
                logAction('ALERTA_CRITICO', `ZEROU TODO O QUADRO DE FUNCIONÁRIOS DO SISTEMA.`);
                setEmployees([]); alert("✅ Todos os funcionários foram removidos. O sistema está limpo.");
              }
            }
          };

          const handleSaveEdit = () => {
             logAction('EDITAR_FUNCIONÁRIO', `Editou os dados de cadastro de ${editingEmp.name}`);
             setEmployees(employees.map(e => e.id === editingEmp.id ? editingEmp : e));
             setEditingEmp(null);
          };

          const filteredEmployees = employees.filter(emp => {
            const searchLow = searchTerm.toLowerCase();
            const matchesSearch = (emp.name.toLowerCase().includes(searchLow) || emp.id.toLowerCase().includes(searchLow) || emp.role.toLowerCase().includes(searchLow));
            const matchesShift = filterShift ? (emp.shift || 'Geral') === filterShift : true;
            const matchesRole = filterRole ? (emp.role || 'Sem cargo') === filterRole : true;
            const matchesStatus = filterStatus ? emp.status === filterStatus : true;
            return matchesSearch && matchesShift && matchesRole && matchesStatus;
          });

          // --- FUNÇÃO PARA EXPORTAR EXCEL ---
          const handleExportExcel = () => {
              const headers = ['Matrícula', 'Nome Completo', 'Cargo / Função', 'Turno / Setor', 'Horário', 'Data de Admissão', 'Contato (Telefone)', 'Status'];
              
              const rows = filteredEmployees.map(emp => [
                  emp.id,
                  `"${emp.name}"`, 
                  `"${emp.role || ''}"`,
                  `"${emp.shift || ''}"`,
                  `"${emp.schedule || ''}"`,
                  emp.admissionDate && emp.admissionDate !== '-' ? formatDateBR(emp.admissionDate) : '-',
                  `"${emp.contact || '-'}"`,
                  emp.status
              ]);

              const csvContent = [
                  headers.join(';'),
                  ...rows.map(r => r.join(';'))
              ].join('\n');

              // \uFEFF força o Excel a reconhecer os acentos do Português (UTF-8)
              const blob = new Blob(['\uFEFF' + csvContent], { type: 'text/csv;charset=utf-8;' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.setAttribute('download', `Quadro_Funcionarios_${new Date().toISOString().split('T')[0]}.csv`);
              document.body.appendChild(link);
              link.click();
              document.body.removeChild(link);

              logAction('EXPORTAR_FUNCIONÁRIOS', `Baixou uma planilha Excel com ${filteredEmployees.length} funcionário(s).`);
          };

          const activeCount = employees.filter(e => e.status === 'Ativo').length;
          const inactiveCount = employees.length - activeCount;

          const getEmployeeHistory = (empId) => {
            const history = [];
            Object.entries(records).forEach(([dateStr, dayRecords]) => {
              const statuses = normalizeStatuses(dayRecords[empId]);
              if (statuses.length > 0) { history.push({ date: dateStr, statuses }); }
            });
            return history.sort((a, b) => new Date(b.date) - new Date(a.date)); 
          };

          return (
            <div className="space-y-6 animate-fade-in pb-10">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row md:items-center justify-between gap-4">
                <div className="flex items-center gap-4">
                  <div className="p-4 bg-blue-100 text-blue-600 rounded-xl shrink-0"><Users className="w-8 h-8" /></div>
                  <div><h2 className="text-2xl font-bold text-gray-800">Gestão de Efetivo</h2><p className="text-sm text-gray-500 mt-1">Cadastre, pesquise e veja o histórico dos funcionários.</p></div>
                </div>
                <div className="flex gap-4">
                  <div className="text-center px-4 border-r border-gray-200"><span className="block text-2xl font-bold text-green-600">{activeCount}</span><span className="text-xs text-gray-500 uppercase font-semibold">Ativos</span></div>
                  <div className="text-center px-4"><span className="block text-2xl font-bold text-red-500">{inactiveCount}</span><span className="text-xs text-gray-500 uppercase font-semibold">Inativos</span></div>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="flex flex-wrap border-b border-gray-100 bg-slate-50 gap-2 p-2">
                  <button className={`px-6 py-2.5 text-sm font-bold rounded-lg transition ${!isBulkImport ? 'bg-blue-600 text-white shadow-sm' : 'bg-transparent text-gray-600 hover:bg-gray-200'}`} onClick={() => setIsBulkImport(false)}>Cadastro Individual</button>
                  <button className={`px-6 py-2.5 text-sm font-bold rounded-lg transition flex items-center gap-2 ${isBulkImport ? 'bg-blue-600 text-white shadow-sm' : 'bg-transparent text-gray-600 hover:bg-gray-200'}`} onClick={() => setIsBulkImport(true)}><Upload className="w-4 h-4" /> Importação em Lote</button>
                  
                  <div className="ml-auto flex flex-wrap gap-2">
                      <button onClick={handleExportExcel} className="flex items-center px-4 py-2 bg-emerald-100 text-emerald-800 hover:bg-emerald-200 font-bold rounded-lg transition text-sm border border-emerald-300 shadow-sm" title="Baixa a lista de funcionários visível atualmente abaixo.">
                          <Download className="w-4 h-4 mr-2" /> Exportar Planilha
                      </button>

                      <button onClick={handleDeleteAllEmployees} className="flex items-center px-4 py-2 bg-red-100 text-red-700 hover:bg-red-200 font-bold rounded-lg transition text-sm">
                          <Trash2 className="w-4 h-4 mr-2" /> Zerar Todos (Nova Lista)
                      </button>
                  </div>
                </div>
                
                <div className="p-6 bg-white">
                  {!isBulkImport ? (
                    <form onSubmit={handleAdd} className="flex flex-col gap-4">
                      <div className="grid grid-cols-1 md:grid-cols-3 lg:grid-cols-4 gap-4">
                        <input type="text" placeholder="Matrícula *" className="border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm font-bold text-blue-900 bg-blue-50" value={newMatricula} onChange={(e) => setNewMatricula(e.target.value)} required />
                        <input type="text" placeholder="Nome Completo *" className="lg:col-span-2 border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm" value={newName} onChange={(e) => setNewName(e.target.value)} required />
                        <div className="relative">
                          <Calendar className="w-4 h-4 text-gray-400 absolute left-3 top-3 pointer-events-none" />
                          <input type="date" className="w-full border border-gray-300 rounded-lg pl-10 pr-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm text-gray-600" value={newAdmissionDate} onChange={(e) => setNewAdmissionDate(e.target.value)} title="Data de Admissão" />
                        </div>
                        <input type="text" placeholder="Cargo / Função" className="border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm" value={newRole} onChange={(e) => setNewRole(e.target.value)} />
                        <input type="text" placeholder="Turno/Setor (Ex: Turno A)" className="border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm" value={newShift} onChange={(e) => handleShiftChange(e.target.value, setNewShift, setNewSchedule)} />
                        <input type="text" placeholder="Horário (Ex: 07:00 as 15:20)" className="border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm" value={newSchedule} onChange={(e) => setNewSchedule(e.target.value)} />
                        <input type="text" placeholder="Telefone / Contato" className="border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm" value={newContact} onChange={(e) => setNewContact(e.target.value)} />
                        <button type="submit" className="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-8 py-2.5 rounded-lg font-bold transition flex items-center justify-center shadow-md"><Plus className="w-5 h-5 mr-2" /> Cadastrar</button>
                      </div>
                    </form>
                  ) : (
                    <div className="flex flex-col gap-6 animate-fade-in">
                      <div className="bg-emerald-50 border border-emerald-200 rounded-xl p-5 shadow-sm">
                          <h4 className="font-bold text-emerald-800 mb-2 flex items-center gap-2">
                              <Database className="w-5 h-5"/> Atualização via Planilha Excel (.CSV)
                          </h4>
                          <p className="text-sm text-emerald-700 mb-4">
                              Selecione o arquivo CSV. O sistema irá ler a Matrícula, Nome, Cargo, Turno e a Data de Admissão e <strong>substituir a lista atual</strong> automaticamente na nuvem.
                          </p>
                          <label className="w-max bg-emerald-600 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-lg font-bold transition flex items-center justify-center shadow-md cursor-pointer">
                              <UploadCloud className="w-5 h-5 mr-2" /> Anexar Arquivo .CSV
                              <input type="file" accept=".csv" className="hidden" onChange={handleCsvUpload} />
                          </label>
                      </div>

                      <div className="flex items-center gap-4">
                          <div className="flex-1 h-px bg-gray-200"></div>
                          <span className="text-xs font-bold text-gray-400 uppercase">OU IMPORTAR TEXTO</span>
                          <div className="flex-1 h-px bg-gray-200"></div>
                      </div>

                      <div className="flex flex-col gap-1">
                        <label className="text-sm font-bold text-gray-700">Cole a lista de funcionários:</label>
                        <textarea className="w-full h-32 border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 shadow-sm text-sm resize-none" placeholder="Cole diretamente do Excel ou Bloco de Notas aqui..." value={bulkData} onChange={(e) => setBulkData(e.target.value)} />
                      </div>
                      <button onClick={handleBulkImport} disabled={!bulkData.trim()} className="bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white px-6 py-2.5 rounded-lg font-bold transition flex items-center justify-center w-max shadow-md"><Upload className="w-5 h-5 mr-2" /> Importar Texto</button>
                    </div>
                  )}
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="p-4 border-b border-gray-100 flex flex-col xl:flex-row justify-between items-center gap-4 bg-white">
                  <h3 className="text-lg font-bold text-gray-800">Efetivo Cadastrado</h3>
                  <div className="flex flex-wrap w-full xl:w-auto gap-3 items-center justify-end">
                    <select className="py-2.5 px-4 border border-gray-300 rounded-full text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-gray-700 bg-gray-50 font-medium shadow-sm" value={filterStatus} onChange={(e) => setFilterStatus(e.target.value)}>
                      <option value="">Status: Todos</option>
                      <option value="Ativo">🟢 Ativos</option>
                      <option value="Inativo">🔴 Inativos</option>
                    </select>
                    <select className="py-2.5 px-4 border border-gray-300 rounded-full text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-gray-700 bg-gray-50 font-medium shadow-sm" value={filterShift} onChange={(e) => setFilterShift(e.target.value)}>
                      <option value="">Turno: Todos</option>
                      {availableShifts.map(shift => <option key={shift} value={shift}>{shift}</option>)}
                    </select>
                    <select className="py-2.5 px-4 border border-gray-300 rounded-full text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition text-gray-700 bg-gray-50 font-medium shadow-sm max-w-[200px] truncate" value={filterRole} onChange={(e) => setFilterRole(e.target.value)}>
                      <option value="">Função: Todas</option>
                      {availableRoles.map(role => <option key={role} value={role}>{role}</option>)}
                    </select>
                    <div className="relative w-full sm:w-64">
                      <Search className="w-5 h-5 text-gray-400 absolute left-3 top-2.5" />
                      <input type="text" placeholder="Buscar nome ou matrícula..." className="w-full pl-10 pr-4 py-2.5 border border-gray-300 rounded-full text-sm outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500 transition shadow-sm" value={searchTerm} onChange={(e) => setSearchTerm(e.target.value)} />
                    </div>
                  </div>
                </div>
                <div className="overflow-x-auto">
                  <table className="w-full text-left border-collapse">
                    <thead className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider">
                      <tr><th className="p-4 font-bold border-b w-1/4">Funcionário & Matrícula</th><th className="p-4 font-bold border-b">Cargo / Função</th><th className="p-4 font-bold border-b">Turno & Horário</th><th className="p-4 font-bold border-b">Contato</th><th className="p-4 font-bold border-b text-center">Status</th><th className="p-4 font-bold border-b text-center">Ações</th></tr>
                    </thead>
                    <tbody className="divide-y divide-gray-100">
                      {filteredEmployees.map(emp => (
                        <tr key={emp.id} className="hover:bg-blue-50/50 transition-colors">
                          <td className="p-4"><div className="font-bold text-gray-800 whitespace-normal break-words">{emp.name}</div><div className="text-[11px] font-bold text-blue-600 mt-0.5 uppercase tracking-wide">MAT: {emp.id}</div></td>
                          <td className="p-4 text-gray-600 text-sm whitespace-normal break-words max-w-[200px]">{emp.role}</td>
                          <td className="p-4"><span className="bg-slate-100 text-slate-700 px-2.5 py-1 rounded text-xs font-bold border border-slate-200 block w-max">{emp.shift || 'Geral'}</span><div className="text-[11px] text-gray-500 mt-1.5 flex items-center gap-1"><Clock className="w-3 h-3" />{emp.schedule || 'Não definido'}</div></td>
                          <td className="p-4 text-sm text-gray-600"><div className="flex items-center gap-1.5"><Phone className="w-3.5 h-3.5 text-gray-400" />{emp.contact || '-'}</div></td>
                          <td className="p-4 text-center"><span className={`inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-[11px] font-bold uppercase tracking-wide ${emp.status === 'Ativo' ? 'bg-green-100 text-green-700 border border-green-200' : 'bg-red-100 text-red-700 border border-red-200'}`}>{emp.status === 'Ativo' ? <span className="w-1.5 h-1.5 rounded-full bg-green-500"></span> : <span className="w-1.5 h-1.5 rounded-full bg-red-500"></span>}{emp.status}</span></td>
                          <td className="p-4 text-center">
                            <div className="flex items-center justify-center gap-2">
                              <button onClick={() => setHistoryEmp(emp)} className="p-1.5 bg-blue-50 border border-blue-200 text-blue-600 hover:bg-blue-100 hover:text-blue-700 rounded-lg shadow-sm transition" title="Ver Histórico de Ocorrências"><History className="w-4 h-4" /></button>
                              <button onClick={() => setEditingEmp(emp)} className="p-1.5 bg-white border border-gray-200 text-gray-600 hover:bg-gray-50 hover:text-gray-800 rounded-lg shadow-sm transition" title="Editar Funcionário"><Edit2 className="w-4 h-4" /></button>
                              <button onClick={() => toggleStatus(emp.id)} className={`px-3 py-1.5 rounded-lg text-xs font-bold transition flex items-center gap-1.5 border shadow-sm ${emp.status === 'Ativo' ? 'bg-white border-orange-200 text-orange-600 hover:bg-orange-50' : 'bg-white border-green-200 text-green-600 hover:bg-green-50'}`}>{emp.status === 'Ativo' ? <React.Fragment><UserX className="w-3.5 h-3.5" /> Inativar</React.Fragment> : <React.Fragment><UserCheck className="w-3.5 h-3.5" /> Reativar</React.Fragment>}</button>
                              {deleteConfirmId === emp.id ? (
                                <div className="flex items-center gap-1 bg-red-50 p-1 rounded-lg border border-red-200 animate-fade-in">
                                  <span className="text-[10px] font-bold text-red-600 px-1">Excluir?</span>
                                  <button onClick={() => handleDeleteEmployee(emp.id)} className="p-1 bg-red-500 text-white rounded hover:bg-red-600 transition" title="Confirmar Desligamento"><CheckCircle2 className="w-3.5 h-3.5" /></button>
                                  <button onClick={() => setDeleteConfirmId(null)} className="p-1 bg-white text-gray-600 border border-gray-200 rounded hover:bg-gray-100 transition" title="Cancelar"><X className="w-3.5 h-3.5" /></button>
                                </div>
                              ) : (
                                <button onClick={() => setDeleteConfirmId(emp.id)} className="p-1.5 bg-white border border-red-200 text-red-500 hover:bg-red-50 hover:text-red-700 rounded-lg shadow-sm transition" title="Desligar / Excluir Funcionário Definitivamente">
                                  <Trash2 className="w-4 h-4" />
                                </button>
                              )}
                            </div>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>

              {historyEmp && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-xl shadow-xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col max-h-[85vh]">
                    <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-blue-50 shrink-0">
                      <div className="flex items-center gap-3"><div className="p-2 bg-blue-100 text-blue-700 rounded-lg"><History className="w-5 h-5"/></div><div><h3 className="font-bold text-blue-900 leading-tight">Histórico de Ocorrências</h3><p className="text-xs text-blue-700">{historyEmp.name}</p></div></div>
                      <button onClick={() => setHistoryEmp(null)} className="text-blue-400 hover:text-blue-700 transition"><X className="w-6 h-6" /></button>
                    </div>
                    <div className="p-6 overflow-y-auto bg-slate-50 flex-1">
                      {getEmployeeHistory(historyEmp.id).length === 0 ? (
                        <div className="text-center py-10"><CheckCircle2 className="w-12 h-12 text-gray-300 mx-auto mb-3" /><p className="text-gray-500 font-medium">Nenhuma ocorrência registrada para este funcionário.</p></div>
                      ) : (
                        <div className="space-y-4">
                          {getEmployeeHistory(historyEmp.id).map((record, idx) => (
                            <div key={idx} className="bg-white border border-gray-200 rounded-lg p-4 flex items-center justify-between shadow-sm hover:shadow-md transition">
                              <div className="flex items-center gap-4">
                                <div className="bg-slate-100 border border-slate-200 text-slate-700 font-bold px-3 py-2 rounded-lg text-sm text-center min-w-[100px]"><span className="block text-[10px] uppercase text-slate-400 mb-0.5">Data</span>{formatDateBR(record.date)}</div>
                                <div className="flex flex-wrap gap-2">
                                  {record.statuses.map(status => {
                                    const hasDetails = status.includes(':');
                                    const baseCode = hasDetails ? status.split(':')[0].trim() : status;
                                    const details = hasDetails ? status.substring(status.indexOf(':') + 1).trim() : '';
                                    const dict = STATUS_DICT[baseCode];
                                    
                                    if (dict) {
                                      const displayLabel = hasDetails ? `${baseCode} - ${details}` : `${status} - ${dict.label}`;
                                      return <span key={status} className={`px-3 py-1 rounded-full text-xs font-bold border ${dict.color}`}>{displayLabel}</span>;
                                    } else {
                                      return <span key={status} className="px-3 py-1 rounded-full text-xs font-bold border border-slate-300 bg-slate-100 text-slate-800">{status}</span>;
                                    }
                                  })}
                                </div>
                              </div>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {editingEmp && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-xl shadow-xl w-full max-w-lg overflow-hidden animate-fade-in flex flex-col">
                    <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-slate-50"><h3 className="text-lg font-bold text-gray-800">Editar Funcionário</h3><button onClick={() => setEditingEmp(null)} className="text-gray-400 hover:text-gray-600"><X className="w-5 h-5" /></button></div>
                    <div className="p-6 flex flex-col gap-4">
                      <div className="grid grid-cols-3 gap-4">
                        <div className="col-span-1"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Matrícula</label><input type="text" className="w-full border border-gray-200 rounded-lg px-4 py-2 bg-gray-100 text-gray-500 cursor-not-allowed font-bold" value={editingEmp.id} readOnly title="A matrícula não pode ser alterada para não perder o histórico." /></div>
                        <div className="col-span-2"><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Nome Completo</label><input type="text" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500" value={editingEmp.name} onChange={(e) => setEditingEmp({...editingEmp, name: e.target.value})} /></div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Cargo / Função</label><input type="text" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500" value={editingEmp.role} onChange={(e) => setEditingEmp({...editingEmp, role: e.target.value})} /></div>
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Contato (Telefone)</label><input type="text" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500" value={editingEmp.contact || ''} onChange={(e) => setEditingEmp({...editingEmp, contact: e.target.value})} /></div>
                      </div>
                      <div className="grid grid-cols-2 gap-4">
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Turno / Setor</label><input type="text" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500" value={editingEmp.shift} onChange={(e) => handleShiftChange(e.target.value, (val) => setEditingEmp({...editingEmp, shift: val}), (val) => setEditingEmp(prev => ({...prev, schedule: val})))} /></div>
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Horário</label><input type="text" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500" value={editingEmp.schedule} onChange={(e) => setEditingEmp({...editingEmp, schedule: e.target.value})} /></div>
                      </div>
                      <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1">Data de Admissão</label><input type="date" className="w-full border border-gray-300 rounded-lg px-4 py-2 outline-none focus:ring-2 focus:ring-blue-500 text-gray-600" value={editingEmp.admissionDate} onChange={(e) => setEditingEmp({...editingEmp, admissionDate: e.target.value})} /></div>
                    </div>
                    <div className="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-slate-50"><button onClick={() => setEditingEmp(null)} className="px-5 py-2 text-sm font-bold text-gray-600 hover:bg-gray-200 rounded-lg transition">Cancelar</button><button onClick={handleSaveEdit} className="px-5 py-2 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-md">Salvar Alterações</button></div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function PunishmentView({ employees, punishments, setPunishments, logAction }) {
          const activeEmployees = [...employees].filter(e => e.status === 'Ativo').sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          const [detailsEmpId, setDetailsEmpId] = useState(null); 
          const [reasonModal, setReasonModal] = useState(null);   

          const getPunishmentData = (empId) => {
            const data = punishments[empId];
            if (typeof data === 'number') return { step: data, reasons: {}, dates: {} }; 
            if (!data) return { step: 0, reasons: {}, dates: {} };
            if (data.reason !== undefined && data.reasons === undefined) return { step: data.step, reasons: { [data.step]: data.reason }, dates: {} };
            if (!data.reasons) return { step: data.step, reasons: {}, dates: data.dates || {} };
            return { ...data, dates: data.dates || {} };
          };

          const advanceStep = (empId) => { 
            const emp = activeEmployees.find(e => e.id === empId);
            setPunishments(prev => { 
              const current = getPunishmentData(empId); 
              let newStep = current.step + 1; 
              if (newStep >= PUNISHMENT_STEPS.length) newStep = PUNISHMENT_STEPS.length - 1; 
              
              logAction('PUNIÇÃO_AVANÇOU', `Avançou punição de ${emp?.name} para Nível ${newStep}`);
              return { ...prev, [empId]: { step: newStep, reasons: current.reasons, dates: current.dates } }; 
            }); 
          };
          
          const revertStep = (empId) => { 
            const emp = activeEmployees.find(e => e.id === empId);
            setPunishments(prev => { 
              const current = getPunishmentData(empId); 
              if (current.step === 0) return prev; 
              let newStep = current.step - 1; 
              const newReasons = { ...current.reasons }; 
              const newDates = { ...current.dates };
              delete newReasons[current.step]; 
              delete newDates[current.step];

              logAction('PUNIÇÃO_REVERTEU', `Desfez a punição Nível ${current.step} de ${emp?.name}`);
              return { ...prev, [empId]: { step: newStep, reasons: newReasons, dates: newDates } }; 
            }); 
          };
          
          const updateReason = (empId, stepIndex, reasonText, reasonDate) => { 
            const emp = activeEmployees.find(e => e.id === empId);
            logAction('PUNIÇÃO_ANOTAÇÃO', `Editou os motivos da punição Nível ${stepIndex} de ${emp?.name}`);

            setPunishments(prev => { 
              const current = getPunishmentData(empId); 
              return { 
                ...prev, 
                [empId]: { 
                  ...current, 
                  reasons: { ...current.reasons, [stepIndex]: reasonText },
                  dates: { ...current.dates, [stepIndex]: reasonDate }
                } 
              }; 
            }); 
          };

          const punishedEmployees = activeEmployees.filter(emp => getPunishmentData(emp.id).step > 0);
          const selectedEmp = detailsEmpId ? activeEmployees.find(e => e.id === detailsEmpId) : null;
          const selectedEmpData = selectedEmp ? getPunishmentData(selectedEmp.id) : null;
          const selectedEmpStep = selectedEmpData ? selectedEmpData.step : 0;
          const currentStepDef = selectedEmpData ? PUNISHMENT_STEPS[selectedEmpStep] : null;
          const nextStepDef = selectedEmpData && selectedEmpStep < PUNISHMENT_STEPS.length - 1 ? PUNISHMENT_STEPS[selectedEmpStep + 1] : null;

          return (
            <div className="space-y-6 animate-fade-in pb-10">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row md:items-center gap-4">
                <div className="p-4 bg-red-100 text-red-600 rounded-xl shrink-0 w-max"><ShieldAlert className="w-8 h-8" /></div>
                <div><h2 className="text-2xl font-bold text-gray-800">Controle de Punição Disciplinar</h2><p className="text-sm text-gray-500 mt-1">Pesquise um funcionário ou veja o quadro geral de punições ativas.</p></div>
              </div>

              <div className="bg-white border border-red-200 shadow-sm rounded-xl overflow-hidden">
                <div className="bg-red-50 px-6 py-4 border-b border-red-100 flex items-center gap-2"><Search className="w-5 h-5 text-red-600" /><h3 className="font-bold text-red-800">Buscar / Aplicar Nova Punição</h3></div>
                <div className="p-6">
                  <select className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-red-500 text-sm shadow-sm" value="" onChange={(e) => { if(e.target.value) { setDetailsEmpId(e.target.value); } }}>
                    <option value="">-- Selecione o funcionário para abrir o painel disciplinar --</option>
                    {activeEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name} ({emp.role || 'Sem cargo'})</option>)}
                  </select>
                </div>
              </div>

              <div className="bg-white rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                <div className="px-6 py-4 border-b border-gray-100 bg-white flex justify-between items-center"><h3 className="font-bold text-gray-800">Quadro de Punições Ativas</h3><span className="bg-red-50 text-red-600 px-3 py-1 rounded-full text-xs font-bold border border-red-200">{punishedEmployees.length} Funcionários Punidos</span></div>
                {punishedEmployees.length === 0 ? (
                  <div className="p-10 text-center text-gray-500"><CheckCircle2 className="w-10 h-10 text-green-400 mx-auto mb-3" />Nenhum funcionário possui punições disciplinares ativas no momento.</div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left border-collapse">
                      <thead className="bg-gray-50 text-gray-500 text-xs uppercase tracking-wider"><tr><th className="p-4 font-bold border-b">Funcionário</th><th className="p-4 font-bold border-b text-center">Nível Disciplinar Atual</th><th className="p-4 font-bold border-b text-center">Ação</th></tr></thead>
                      <tbody className="divide-y divide-gray-100">
                        {punishedEmployees.map(emp => {
                          const empData = getPunishmentData(emp.id); const stepDef = PUNISHMENT_STEPS[empData.step];
                          return (
                            <tr key={emp.id} className="hover:bg-slate-50 transition">
                              <td className="p-4"><div className="font-bold text-gray-800">{emp.name}</div><div className="text-[11px] text-gray-400">{emp.role}</div></td>
                              <td className="p-4 text-center"><span className={`inline-block px-3 py-1 rounded-full text-[10px] font-bold border ${stepDef.color}`}>{stepDef.label}</span></td>
                              <td className="p-4 text-center"><button onClick={() => setDetailsEmpId(emp.id)} className="px-4 py-1.5 bg-white border border-gray-300 text-gray-700 hover:bg-gray-50 hover:text-blue-600 rounded shadow-sm text-xs font-bold transition flex items-center justify-center gap-2 mx-auto"><FileText className="w-3.5 h-3.5" /> Ver Detalhes</button></td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>

              {selectedEmp && (
                <div className="fixed inset-0 bg-black/60 z-40 flex items-center justify-center p-4">
                  <div className="bg-white rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden flex flex-col max-h-[90vh] animate-fade-in">
                    <div className="p-5 border-b border-gray-100 bg-slate-50 flex justify-between items-center shrink-0">
                      <div><h3 className="text-xl font-bold text-gray-800 leading-tight">{selectedEmp.name}</h3><div className="mt-1 flex items-center gap-2"><span className="text-xs text-gray-500 font-medium">Situação Atual:</span><span className={`text-[10px] px-2 py-0.5 rounded border font-bold tracking-wide ${currentStepDef.color}`}>{currentStepDef.label.toUpperCase()}</span></div></div>
                      <button onClick={() => setDetailsEmpId(null)} className="p-2 text-gray-400 hover:text-red-500 hover:bg-red-50 rounded-full transition"><X className="w-6 h-6" /></button>
                    </div>
                    <div className="overflow-y-auto flex-1 p-6 bg-white">
                      <div className="flex flex-wrap items-center gap-3 mb-8 bg-gray-50 p-4 rounded-xl border border-gray-200">
                        <h4 className="text-sm font-bold text-gray-700 mr-auto">Gerenciar Medidas:</h4>
                        {selectedEmpStep > 0 && <button onClick={() => revertStep(selectedEmp.id)} className="flex items-center gap-2 px-4 py-2 bg-white border border-gray-300 hover:bg-gray-100 text-gray-700 rounded-lg shadow-sm text-sm font-bold transition-colors"><Undo2 className="w-4 h-4" /> Desfazer Última</button>}
                        {nextStepDef ? <button onClick={() => advanceStep(selectedEmp.id)} className="flex items-center gap-2 px-5 py-2 bg-red-600 hover:bg-red-700 text-white text-sm font-bold rounded-lg shadow-md transition-transform hover:scale-105 active:scale-95">Aplicar: {nextStepDef.label} <ArrowRight className="w-4 h-4" /></button> : <span className="flex items-center gap-2 px-5 py-2 bg-slate-800 text-slate-300 text-sm font-bold rounded-lg shadow-inner cursor-not-allowed"><ShieldAlert className="w-4 h-4" /> Ação Máxima Atingida</span>}
                      </div>
                      <div className="overflow-x-auto pb-6 mb-4">
                        <div className="min-w-[850px] flex items-center justify-between relative px-10 pt-2">
                          <div className="absolute left-14 right-14 top-5 h-1.5 bg-gray-200 -z-10 rounded-full"></div>
                          <div className="absolute left-14 top-5 h-1.5 bg-red-400 -z-10 rounded-full transition-all duration-500 ease-in-out" style={{ width: `calc(${(selectedEmpStep / (PUNISHMENT_STEPS.length - 1)) * 100}% - 7rem)` }}></div>
                          {PUNISHMENT_STEPS.map((step, idx) => {
                            const isPast = idx <= selectedEmpStep; const isCurrent = idx === selectedEmpStep;
                            return (
                              <div key={step.id} className="flex flex-col items-center relative cursor-default" title={step.label}>
                                <div className={`w-7 h-7 rounded-full border-[3px] flex items-center justify-center transition-all duration-300 shadow-sm bg-white ${isCurrent ? 'ring-4 ring-offset-2 scale-125 ' + step.dot.replace('bg-', 'ring-') : ''} ${isPast ? step.dot + ' border-white' : 'border-gray-300'}`}></div>
                                <span className={`text-[11px] mt-4 font-bold w-20 text-center leading-tight ${isCurrent ? 'text-gray-900' : 'text-gray-400'}`}>{step.label}</span>
                              </div>
                            );
                          })}
                        </div>
                      </div>
                      {selectedEmpStep > 0 && (
                        <div className="pt-6 border-t border-gray-100">
                          <h4 className="text-sm font-bold text-slate-700 mb-6 flex items-center gap-2"><FileText className="w-4 h-4 text-slate-400" /> Histórico de Justificativas e Anotações</h4>
                          <div className="space-y-0 ml-2">
                            {PUNISHMENT_STEPS.slice(1, selectedEmpStep + 1).map((step, idx) => {
                              const sIdx = idx + 1; 
                              const savedText = selectedEmpData.reasons?.[sIdx] || '';
                              const savedDate = selectedEmpData.dates?.[sIdx] || '';
                              
                              return (
                                <div key={step.id} className="relative pl-8 border-l-2 border-gray-200 last:border-l-transparent pb-8">
                                  <span className={`absolute -left-[11px] top-0 w-5 h-5 rounded-full border-4 border-white flex items-center justify-center shadow-sm ${step.dot}`}></span>
                                  <div className="bg-white p-5 rounded-xl border border-gray-200 shadow-sm hover:shadow-md transition">
                                    <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-3 mb-3">
                                        <h5 className="font-bold text-gray-800 text-sm flex items-center gap-2">{step.label}</h5>
                                        <button onClick={() => setReasonModal({ empId: selectedEmp.id, stepIndex: sIdx, text: savedText, date: savedDate || toLocalISODate(new Date()) })} className="flex items-center gap-1.5 text-[11px] font-bold text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition shadow-sm border border-blue-100"><Edit2 className="w-3 h-3" /> Editar Anotação</button>
                                    </div>
                                    {savedText ? (
                                        <div>
                                            {savedDate && <div className="text-[11px] font-bold text-blue-600 mb-1.5 flex items-center gap-1"><CalendarClock className="w-3 h-3"/> Aplicada em: {formatDateBR(savedDate)}</div>}
                                            <div className="text-sm text-gray-600 whitespace-pre-wrap leading-relaxed bg-gray-50 p-4 rounded-lg border border-gray-100">{savedText}</div>
                                        </div>
                                    ) : (
                                        <p className="text-sm text-gray-400 italic bg-gray-50 p-3 rounded-lg border border-dashed border-gray-200">Nenhuma justificativa registrada. Clique em "Editar Anotação" para adicionar detalhes.</p>
                                    )}
                                  </div>
                                </div>
                              );
                            })}
                          </div>
                        </div>
                      )}
                    </div>
                  </div>
                </div>
              )}

              {reasonModal && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-xl shadow-2xl w-full max-w-lg overflow-hidden animate-fade-in flex flex-col">
                    <div className="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-slate-50"><h3 className="text-lg font-bold text-gray-800 flex items-center gap-2"><FileText className="w-5 h-5 text-blue-600" />Anotação: {PUNISHMENT_STEPS[reasonModal.stepIndex].label}</h3><button onClick={() => setReasonModal(null)} className="text-gray-400 hover:text-gray-600 transition"><X className="w-5 h-5" /></button></div>
                    
                    <div className="p-6 flex flex-col gap-4">
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Data da Aplicação</label>
                        <input type="date" className="w-full border border-gray-300 rounded-lg px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm text-gray-700 font-medium" value={reasonModal.date} onChange={(e) => setReasonModal({ ...reasonModal, date: e.target.value })} />
                      </div>
                      <div>
                        <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-2">Descreva o motivo e os detalhes da punição</label>
                        <textarea className="w-full text-sm p-4 rounded-xl border border-gray-300 focus:border-blue-400 focus:ring-4 focus:ring-blue-400/20 outline-none transition resize-none h-40 bg-gray-50 focus:bg-white shadow-inner text-gray-700" placeholder="Escreva todos os detalhes aqui..." value={reasonModal.text} onChange={(e) => setReasonModal({ ...reasonModal, text: e.target.value })} autoFocus />
                      </div>
                    </div>

                    <div className="px-6 py-4 border-t border-gray-100 flex justify-end gap-3 bg-slate-50"><button onClick={() => setReasonModal(null)} className="px-6 py-2.5 text-sm font-bold text-gray-600 hover:bg-gray-200 rounded-lg transition">Cancelar</button><button onClick={() => { updateReason(reasonModal.empId, reasonModal.stepIndex, reasonModal.text, reasonModal.date); setReasonModal(null); }} className="px-8 py-2.5 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition shadow-md">Salvar Anotação</button></div>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function RemindersView({ employees, reminders, setReminders, logAction }) {
          const activeEmployees = [...employees].filter(e => e.status === 'Ativo').sort((a, b) => (a.name || '').localeCompare(b.name || ''));
          const [isModalOpen, setIsModalOpen] = useState(false);
          const [editingId, setEditingId] = useState(null); 
          const [deleteConfirmId, setDeleteConfirmId] = useState(null); 
          const [title, setTitle] = useState('');
          const [type, setType] = useState('ASSINATURA');
          const [customType, setCustomType] = useState(''); 
          const [priority, setPriority] = useState('MEDIA');
          const [dueDate, setDueDate] = useState('');
          const [empId, setEmpId] = useState('');
          const [description, setDescription] = useState('');
          const [draggingId, setDraggingId] = useState(null);

          const TASK_TYPES = {
            'ASSINATURA': { label: 'Assinatura Pendente', icon: PenTool, color: 'text-purple-600 bg-purple-100 border-purple-200' },
            'CARTAO': { label: 'Entrega de Cartão / EPI', icon: CreditCard, color: 'text-blue-600 bg-blue-100 border-blue-200' },
            'DOC': { label: 'Envio de Documento', icon: Mail, color: 'text-emerald-600 bg-emerald-100 border-emerald-200' },
            'GERAL': { label: 'Ação Geral RH', icon: BellRing, color: 'text-gray-600 bg-gray-100 border-gray-200' }
          };

          const existingCustomTypes = useMemo(() => {
            const standardKeys = Object.keys(TASK_TYPES);
            const allTypes = reminders.map(r => r.type);
            return Array.from(new Set(allTypes)).filter(t => !standardKeys.includes(t) && t !== 'CUSTOM');
          }, [reminders]);

          const PRIORITIES = {
            'ALTA': { label: 'Alta Prioridade', dot: 'bg-red-500', border: 'border-l-4 border-l-red-500' },
            'MEDIA': { label: 'Prioridade Média', dot: 'bg-yellow-400', border: 'border-l-4 border-l-yellow-400' },
            'BAIXA': { label: 'Prioridade Baixa', dot: 'bg-blue-400', border: 'border-l-4 border-l-blue-400' }
          };

          const openCreateModal = () => { setEditingId(null); setTitle(''); setType('ASSINATURA'); setCustomType(''); setPriority('MEDIA'); setDueDate(''); setEmpId(''); setDescription(''); setIsModalOpen(true); };
          const openEditModal = (rem) => { setEditingId(rem.id); setTitle(rem.title); if (TASK_TYPES[rem.type]) { setType(rem.type); setCustomType(''); } else { setType('CUSTOM'); setCustomType(rem.type); } setPriority(rem.priority); setDueDate(rem.dueDate || ''); setEmpId(rem.empId || ''); setDescription(rem.description || ''); setIsModalOpen(true); };

          const handleSaveReminder = (e) => {
            e.preventDefault(); if (!title.trim()) return;
            let finalType = type; if (type === 'CUSTOM') { if (!customType.trim()) return; finalType = customType.trim().toUpperCase(); }
            if (editingId) {
              logAction('EDITAR_LEMBRETE', `Atualizou o lembrete/tarefa: "${title}"`);
              setReminders(reminders.map(r => r.id === editingId ? { ...r, title, type: finalType, priority, dueDate, empId: empId || null, description } : r));
            } else {
              logAction('CRIAR_LEMBRETE', `Criou um novo lembrete/tarefa: "${title}"`);
              const newReminder = { id: Date.now().toString(), title, type: finalType, priority, dueDate, empId: empId || null, description, status: 'PENDING', createdAt: new Date().toISOString() };
              setReminders([newReminder, ...reminders]);
            }
            setIsModalOpen(false); setEditingId(null); setTitle(''); setType('ASSINATURA'); setCustomType(''); setPriority('MEDIA'); setDueDate(''); setEmpId(''); setDescription('');
          };

          const updateStatus = (id, newStatus) => { 
            const rem = reminders.find(r => r.id === id);
            logAction('MOVER_LEMBRETE', `Moveu o lembrete "${rem?.title}" para a coluna ${newStatus}`);
            setReminders(reminders.map(r => r.id === id ? { ...r, status: newStatus } : r)); 
          };
          const deleteReminder = (id) => { 
            const rem = reminders.find(r => r.id === id);
            logAction('EXCLUIR_LEMBRETE', `Excluiu o lembrete/tarefa: "${rem?.title}"`);
            setReminders(reminders.filter(r => r.id !== id)); setDeleteConfirmId(null); 
          };

          const handleDragStart = (e, id) => { e.dataTransfer.setData('taskId', id); setDraggingId(id); };
          const handleDragEnd = () => { setDraggingId(null); };
          const handleDragOver = (e) => { e.preventDefault(); };
          const handleDrop = (e, colStatus) => { e.preventDefault(); const id = e.dataTransfer.getData('taskId'); if (id) { updateStatus(id, colStatus); } setDraggingId(null); };

          const todayStr = toLocalISODate(new Date());
          const getDueStatus = (date, status) => {
            if (!date || status === 'DONE') return null;
            if (date < todayStr) return { text: 'Atrasado', color: 'text-red-600 bg-red-50 border-red-200' };
            if (date === todayStr) return { text: 'Vence Hoje', color: 'text-orange-600 bg-orange-50 border-orange-200' };
            return { text: `Para: ${formatDateBR(date)}`, color: 'text-gray-500 bg-gray-50 border-gray-200' };
          };

          const renderColumn = (colStatus, colTitle, headerClasses, bgClasses, iconNode) => {
            const colTasks = reminders.filter(r => r.status === colStatus);
            return (
              <div className={`flex-1 flex flex-col rounded-2xl border min-h-[500px] transition-colors ${bgClasses}`} onDragOver={handleDragOver} onDrop={(e) => handleDrop(e, colStatus)}>
                <div className={`px-5 py-4 font-bold flex justify-between items-center rounded-t-2xl border-b border-black/5 ${headerClasses}`}><div className="flex items-center gap-2">{iconNode} {colTitle}</div><span className="bg-white/60 text-slate-800 px-2.5 py-0.5 rounded-full text-xs shadow-sm">{colTasks.length}</span></div>
                <div className="p-3 flex-1 overflow-y-auto flex flex-col gap-3">
                  {colTasks.length === 0 && <div className="m-auto text-center p-6 text-sm text-gray-400 font-medium border-2 border-dashed border-gray-200 rounded-xl">Arraste tarefas para cá...</div>}
                  {colTasks.map(rem => {
                    const isDone = rem.status === 'DONE';
                    let typeLabel = rem.type; let typeColor = 'text-slate-600 bg-slate-100 border-slate-200'; let TaskIcon = BellRing;
                    if (TASK_TYPES[rem.type]) { typeLabel = TASK_TYPES[rem.type].label; typeColor = TASK_TYPES[rem.type].color; TaskIcon = TASK_TYPES[rem.type].icon; }
                    const priorityStyle = PRIORITIES[rem.priority] || PRIORITIES['MEDIA'];
                    const linkedEmp = rem.empId ? activeEmployees.find(e => e.id === rem.empId) : null;
                    const dueStatus = getDueStatus(rem.dueDate, rem.status);
                    return (
                      <div key={rem.id} draggable onDragStart={(e) => handleDragStart(e, rem.id)} onDragEnd={handleDragEnd} className={`bg-white rounded-xl shadow-sm hover:shadow-md transition-all flex flex-col overflow-hidden relative cursor-grab active:cursor-grabbing border ${draggingId === rem.id ? 'opacity-40 rotate-2 scale-95' : 'opacity-100'} ${isDone ? 'opacity-70 grayscale-[0.3] border-gray-200' : 'border-gray-100 ' + priorityStyle.border}`}>
                        <div className="p-4 flex-1 flex flex-col">
                          <div className="flex justify-between items-start mb-3 gap-2"><span className={`px-2 py-1 rounded text-[10px] font-bold uppercase tracking-wider flex items-center gap-1 border ${typeColor} truncate`}><TaskIcon className="w-3 h-3 shrink-0" /> <span className="truncate">{typeLabel}</span></span>{!isDone && <span title={priorityStyle.label} className={`shrink-0 w-2.5 h-2.5 rounded-full ${priorityStyle.dot} shadow-sm`}></span>}</div>
                          <h3 className={`text-sm font-bold mb-1.5 leading-tight ${isDone ? 'line-through text-gray-500' : 'text-gray-800'}`}>{rem.title}</h3>
                          {rem.description && <p className="text-xs text-gray-500 mb-3 line-clamp-2 leading-relaxed">{rem.description}</p>}
                          <div className="mt-auto pt-2 flex flex-wrap gap-2">
                            {linkedEmp && <div className="flex items-center gap-1.5 text-[10px] font-bold text-slate-700 bg-slate-100 px-2 py-1 rounded border border-slate-200 w-max max-w-full"><Users className="w-3 h-3 shrink-0" /> <span className="truncate">{linkedEmp?.name?.split(' ').slice(0, 2).join(' ') || ''}</span></div>}
                            {dueStatus && <div className={`flex items-center gap-1 text-[10px] font-bold px-2 py-1 rounded border w-max ${dueStatus.color}`}><CalendarClock className="w-3 h-3 shrink-0" /> {dueStatus.text}</div>}
                          </div>
                        </div>
                        <div className="bg-slate-50/80 px-3 py-2 border-t border-gray-100 flex justify-between items-center mt-auto">
                          <div className="flex gap-1.5">
                            {colStatus !== 'PENDING' && <button onClick={() => updateStatus(rem.id, colStatus === 'DONE' ? 'IN_PROGRESS' : 'PENDING')} className="p-1.5 bg-white border border-gray-200 text-gray-500 rounded hover:bg-gray-100 hover:text-blue-600 transition" title="Mover para a esquerda"><ArrowLeft className="w-3.5 h-3.5" /></button>}
                            {colStatus !== 'DONE' && <button onClick={() => updateStatus(rem.id, colStatus === 'PENDING' ? 'IN_PROGRESS' : 'DONE')} className="p-1.5 bg-white border border-gray-200 text-gray-500 rounded hover:bg-gray-100 hover:text-emerald-600 transition" title="Avançar"><ArrowRight className="w-3.5 h-3.5" /></button>}
                          </div>
                          <div className="flex gap-1.5 items-center">
                            <button onClick={() => openEditModal(rem)} className="p-1.5 text-gray-400 hover:bg-blue-50 hover:text-blue-500 rounded transition" title="Editar Lembrete"><Edit2 className="w-3.5 h-3.5" /></button>
                            {deleteConfirmId === rem.id ? <div className="flex items-center gap-1 bg-red-50 p-1 rounded-lg border border-red-200 animate-fade-in"><span className="text-[10px] font-bold text-red-600 px-1">Excluir?</span><button onClick={() => deleteReminder(rem.id)} className="p-1 bg-red-500 text-white rounded hover:bg-red-600 transition"><CheckCircle2 className="w-3 h-3" /></button><button onClick={() => setDeleteConfirmId(null)} className="p-1 bg-white text-gray-600 border border-gray-200 rounded hover:bg-gray-100 transition"><X className="w-3 h-3" /></button></div> : <button onClick={() => setDeleteConfirmId(rem.id)} className="p-1.5 text-gray-400 hover:bg-red-50 hover:text-red-500 rounded transition" title="Excluir"><Trash2 className="w-3.5 h-3.5" /></button>}
                          </div>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            );
          };

          return (
            <div className="space-y-6 animate-fade-in pb-10 h-full flex flex-col">
              <div className="bg-gradient-to-r from-slate-900 to-slate-800 rounded-xl shadow-lg p-6 lg:p-8 flex flex-col md:flex-row md:items-center justify-between gap-6 text-white relative overflow-hidden shrink-0">
                <div className="absolute -right-20 -top-20 w-64 h-64 bg-blue-500 rounded-full blur-3xl opacity-20"></div>
                <div className="flex items-center gap-5 z-10"><div className="p-4 bg-white/10 backdrop-blur-sm text-white rounded-2xl shadow-inner"><LayoutGrid className="w-8 h-8 lg:w-10 lg:h-10" /></div><div><h2 className="text-2xl lg:text-3xl font-extrabold tracking-tight">Quadro Kanban RH</h2><p className="text-blue-100 mt-1 text-sm font-medium">Arraste os lembretes entre as colunas para organizar o fluxo de trabalho.</p></div></div>
                <button onClick={openCreateModal} className="z-10 bg-blue-500 hover:bg-blue-400 text-white px-6 py-3 rounded-xl font-bold transition-all shadow-lg hover:shadow-blue-500/30 flex items-center justify-center hover:scale-105 active:scale-95 whitespace-nowrap"><Plus className="w-5 h-5 mr-2" /> Criar Lembrete</button>
              </div>
              <div className="flex flex-col lg:flex-row items-stretch gap-6 flex-1">
                {renderColumn('PENDING', 'Fazer (Pendentes)', 'bg-slate-200/60 text-slate-800', 'bg-slate-50 border-slate-200', <Circle className="w-4 h-4 text-slate-500" />)}
                {renderColumn('IN_PROGRESS', 'Em Andamento', 'bg-blue-100/60 text-blue-900', 'bg-blue-50/50 border-blue-200', <Activity className="w-4 h-4 text-blue-500" />)}
                {renderColumn('DONE', 'Concluídos', 'bg-emerald-100/60 text-emerald-900', 'bg-emerald-50/50 border-emerald-200', <CheckCircle2 className="w-4 h-4 text-emerald-600" />)}
              </div>

              {isModalOpen && (
                <div className="fixed inset-0 bg-black/60 z-50 flex items-center justify-center p-4">
                  <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl overflow-hidden animate-fade-in flex flex-col">
                    <div className="px-6 py-5 border-b border-gray-100 bg-slate-900 text-white flex justify-between items-center"><h3 className="text-xl font-bold flex items-center gap-2"><BellRing className="w-5 h-5 text-blue-400" /> {editingId ? 'Editar Lembrete / Tarefa' : 'Novo Lembrete / Tarefa'}</h3><button onClick={() => setIsModalOpen(false)} className="text-slate-400 hover:text-white transition"><X className="w-6 h-6" /></button></div>
                    <form onSubmit={handleSaveReminder} className="p-6 flex flex-col gap-5 overflow-y-auto max-h-[75vh]">
                      <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">O que precisa ser feito? *</label><input type="text" required placeholder="Ex: Pegar assinatura da 1ª Advertência" className="w-full border-2 border-gray-200 rounded-xl px-4 py-3 outline-none focus:border-blue-500 focus:bg-blue-50/30 text-base font-medium transition" value={title} onChange={(e) => setTitle(e.target.value)} autoFocus /></div>
                      <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                        <div>
                          <label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Categoria</label>
                          <select className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm font-medium" value={type} onChange={e => setType(e.target.value)}>{Object.entries(TASK_TYPES).map(([k, v]) => <option key={k} value={k}>{v.label}</option>)}{existingCustomTypes.length > 0 && <optgroup label="Minhas Categorias">{existingCustomTypes.map(t => <option key={t} value={t}>{t}</option>)}</optgroup>}<option value="CUSTOM" className="font-bold text-blue-600 bg-blue-50">➕ Criar nova categoria...</option></select>
                          {type === 'CUSTOM' && <input type="text" required placeholder="Digite o nome da categoria" className="mt-2 w-full border-2 border-blue-300 bg-blue-50 rounded-lg p-2.5 outline-none focus:border-blue-600 text-sm shadow-inner animate-fade-in text-blue-900 font-bold" value={customType} onChange={(e) => setCustomType(e.target.value)} />}
                        </div>
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Prioridade</label><select className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm font-medium" value={priority} onChange={e => setPriority(e.target.value)}><option value="ALTA">🔴 Alta</option><option value="MEDIA">🟡 Média</option><option value="BAIXA">🔵 Baixa</option></select></div>
                        <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Prazo (Data)</label><input type="date" className="w-full border border-gray-300 rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm font-medium" value={dueDate} onChange={e => setDueDate(e.target.value)} /></div>
                      </div>
                      <div className="bg-blue-50/50 p-4 rounded-xl border border-blue-100"><label className="block text-xs font-bold text-blue-800 uppercase tracking-wide mb-2 flex items-center gap-1.5"><Users className="w-4 h-4" /> Vincular a um Funcionário (Opcional)</label><select className="w-full border border-white bg-white rounded-lg p-3 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm" value={empId} onChange={e => setEmpId(e.target.value)}><option value="">-- Lembrete Geral (Sem vínculo) --</option>{activeEmployees.map(emp => <option key={emp.id} value={emp.id}>{emp.name}</option>)}</select></div>
                      <div><label className="block text-xs font-bold text-gray-500 uppercase tracking-wide mb-1.5">Detalhes Adicionais</label><textarea placeholder="Escreva observações adicionais aqui..." className="w-full border border-gray-300 rounded-xl p-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm shadow-sm resize-none h-24" value={description} onChange={(e) => setDescription(e.target.value)} /></div>
                      <div className="pt-4 border-t border-gray-100 flex justify-end gap-3 mt-2"><button type="button" onClick={() => setIsModalOpen(false)} className="px-6 py-3 text-sm font-bold text-gray-600 hover:bg-gray-100 rounded-xl transition">Cancelar</button><button type="submit" className="px-8 py-3 text-sm font-bold text-white bg-blue-600 hover:bg-blue-700 rounded-xl transition shadow-lg flex items-center gap-2"><CheckCircle2 className="w-5 h-5" /> {editingId ? 'Salvar Alterações' : 'Salvar Lembrete'}</button></div>
                    </form>
                  </div>
                </div>
              )}
            </div>
          );
        }

        function BackupView({ employees, records, punishments, reminders, setEmployees, setRecords, setPunishments, setReminders, cloudStatus }) {
          const [importStatus, setImportStatus] = useState('');
          const handleExport = () => {
            const allData = { version: '5.0', exportDate: new Date().toISOString(), employees, records, punishments, reminders };
            const dataStr = JSON.stringify(allData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = `Backup_CSVA_RH_${new Date().toISOString().split('T')[0]}.json`;
            document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
          };
          const handleImport = (e) => {
            const file = e.target.files[0]; if (!file) return;
            const reader = new FileReader();
            reader.onload = (event) => {
              try {
                const importedData = JSON.parse(event.target.result);
                if (importedData.employees && importedData.records) {
                  setEmployees(importedData.employees); setRecords(importedData.records);
                  if (importedData.punishments) setPunishments(importedData.punishments);
                  if (importedData.reminders) setReminders(importedData.reminders);
                  setImportStatus('success'); setTimeout(() => setImportStatus(''), 5000);
                } else { setImportStatus('error'); }
              } catch (error) { setImportStatus('error'); }
            };
            reader.readAsText(file); e.target.value = null; 
          };

          return (
            <div className="space-y-6 animate-fade-in pb-10 max-w-4xl mx-auto">
              <div className="bg-white rounded-xl shadow-sm border border-gray-100 p-6 flex flex-col md:flex-row md:items-center gap-4">
                <div className="p-4 bg-slate-100 text-slate-600 rounded-xl shrink-0 w-max"><Database className="w-8 h-8" /></div>
                <div><h2 className="text-2xl font-bold text-gray-800">Sincronização e Backup</h2><p className="text-sm text-gray-500 mt-1">Gira o armazenamento dos seus dados na Nuvem e faça backups locais de segurança.</p></div>
              </div>
              <div className="bg-blue-50 border border-blue-100 rounded-xl p-6 shadow-sm relative overflow-hidden">
                <div className="absolute -right-10 -top-10 opacity-10"><Cloud className="w-48 h-48 text-blue-500" /></div>
                <div className="relative z-10">
                  <div className="flex items-center gap-2 mb-3"><Cloud className="w-6 h-6 text-blue-600" /><h4 className="font-bold text-blue-900 text-lg">Modo Nuvem (Firebase)</h4></div>
                  <p className="text-sm text-blue-800 leading-relaxed mb-4">Todas as alterações feitas são guardadas automaticamente de forma silenciosa e segura na sua base de dados do Google. <strong>Você pode abrir este sistema em qualquer computador conectado à internet.</strong></p>
                  <div className="flex items-center gap-3 bg-white w-max px-4 py-2 rounded-lg shadow-sm border border-blue-100">
                    <span className="text-xs font-bold text-gray-500 uppercase">Status da Conexão:</span>
                    {cloudStatus === 'connecting' && <span className="text-blue-600 font-bold flex items-center gap-1.5 text-sm"><UploadCloud className="w-4 h-4 animate-bounce"/> Conectando...</span>}
                    {cloudStatus === 'syncing' && <span className="text-blue-600 font-bold flex items-center gap-1.5 text-sm"><UploadCloud className="w-4 h-4 animate-bounce"/> A guardar...</span>}
                    {cloudStatus === 'synced' && <span className="text-emerald-600 font-bold flex items-center gap-1.5 text-sm"><CheckCircle2 className="w-4 h-4"/> Tudo salvo na nuvem</span>}
                    {cloudStatus === 'error' && <span className="text-red-600 font-bold flex items-center gap-1.5 text-sm"><AlertCircle className="w-4 h-4"/> Erro ou Sem Internet</span>}
                    {cloudStatus === 'offline' && <span className="text-gray-500 font-bold flex items-center gap-1.5 text-sm"><CloudOff className="w-4 h-4"/> Offline</span>}
                  </div>
                </div>
              </div>
              <div className="mt-8 border-t border-gray-200 pt-8">
                <h4 className="font-bold text-gray-800 mb-4 flex items-center gap-2"><Download className="w-5 h-5 text-gray-400"/> Backup Manual (Garantia Extra)</h4>
                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col items-center text-center hover:border-gray-300 transition-colors">
                    <h3 className="font-bold text-gray-800 mb-2">Exportar Backup (.json)</h3>
                    <p className="text-gray-500 text-xs mb-6 px-2">Baixe o ficheiro completo com os dados atuais para guardar no seu computador ou pendrive.</p>
                    <button onClick={handleExport} className="mt-auto w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 rounded-lg shadow-sm transition flex items-center justify-center gap-2"><Download className="w-4 h-4" /> Baixar Cópia</button>
                  </div>
                  <div className="bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col items-center text-center hover:border-emerald-200 transition-colors opacity-50 grayscale cursor-not-allowed" title="No modo Nuvem, a importação não é recomendada para não apagar a base de dados central.">
                    <h3 className="font-bold text-gray-800 mb-2">Restaurar Ficheiro</h3>
                    <p className="text-gray-500 text-xs mb-6 px-2">A restauração local foi desativada porque os seus dados já estão a vir da nuvem de forma automática.</p>
                    <button disabled className="mt-auto w-full bg-gray-400 text-white font-bold py-3 rounded-lg flex items-center justify-center gap-2 cursor-not-allowed">
                      <UploadCloud className="w-4 h-4" /> Desativado
                    </button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        // Renderização final do React no DOM
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
